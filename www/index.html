/* ═══════════════════ bank sync (optional: your server + Plaid) ═══════════════════ */
const LINK_KEY = "safe-to-spend/link", LINK_TOKEN_KEY = "safe-to-spend/link-token";
// the artifact preview blocks outside servers, so bank syncing runs only in the app or a hosted copy
const IN_PREVIEW = !!(window.claude && window.claude.use);
let LINK = loadLink();
const BANK = {busy:false, working:false, error:""};

function loadLink(){
  try{ const v = JSON.parse(localStorage.getItem(LINK_KEY) || "null"); if(v && v.server && v.token) return v; }catch(e){}
  return null;
}
function saveLink(){
  try{ LINK ? localStorage.setItem(LINK_KEY, JSON.stringify(LINK)) : localStorage.removeItem(LINK_KEY); }catch(e){}
}
function defaultServer(){
  // a copy served by the sync server itself talks to its own origin; the phone app has no default
  return !window.Capacitor && /^https?:$/.test(location.protocol) ? location.origin : "";
}
function normalizeServer(v){
  let s = String(v || "").trim();
  if(!s) return "";
  if(!/^https?:\/\//i.test(s)) s = "https://" + s;
  return s.replace(/\/+$/, "");
}
async function api(path, opts){
  opts = opts || {};
  const base = (opts.server || (LINK && LINK.server) || "").replace(/\/+$/, "");
  const token = opts.token || (LINK && LINK.token);
  const headers = {"Content-Type":"application/json"};
  if(token) headers.Authorization = "Bearer " + token;
  let r;
  try{ r = await fetch(base + path, {method:opts.method || "GET", headers, body:opts.body ? JSON.stringify(opts.body) : undefined}); }
  catch(e){ throw new Error("Could not reach " + (base || "the server") + ". Check the address and your connection."); }
  let j = null;
  try{ j = await r.json(); }catch(e){}
  if(!r.ok){
    const err = new Error((j && j.error) || ("The server answered with error " + r.status + "."));
    err.code = j && j.code; err.status = r.status;
    throw err;
  }
  return j;
}
function paintSyncButton(){
  const b = $("#banksync"); if(!b) return;
  b.hidden = !LINK || IN_PREVIEW || !(LINK.me && LINK.me.access && LINK.me.access.active);
  b.disabled = BANK.busy;
  b.textContent = BANK.busy ? "Syncing…" : "Sync";
}
async function syncBank(manual){
  if(!LINK || BANK.busy) return;
  BANK.busy = true; BANK.error = ""; paintSyncButton();
  try{
    const h = await api("/api/health").catch(() => null);
    if(h){ LINK.plaid = !!h.plaid; LINK.plaidEnv = h.plaidEnv || ""; }
    const r = await api("/api/sync", {method:"POST", body:{since:LINK.since || 0, force:!!manual}});
    const n = applyBankChanges(r);
    LINK.since = r.seq; LINK.items = r.items || []; LINK.lastSync = Date.now();
    if(r.errors && r.errors.length) BANK.error = r.errors.map(e => (e.institution || "A bank") + ": " + e.message).join(" · ");
    saveLink();
    S.__touched = true;
    BANK.busy = false;
    save();
    if(manual) toast(n.added ? "Synced " + n.added + " new transaction" + (n.added===1?"":"s") : "Everything is up to date");
  }catch(e){
    BANK.error = e.code === "SUBSCRIPTION_REQUIRED" ? "Bank syncing needs an active subscription." : e.message;
    if(manual) toast(BANK.error);
    BANK.busy = false;
    if(e.status === 401 || e.status === 402 || e.status === 403) return refreshMe();
    render();
  }finally{ BANK.busy = false; paintSyncButton(); }
}
async function bankAction(fn, okMsg){
  if(BANK.working) return;
  BANK.working = true; render();
  try{ await fn(); if(okMsg) toast(okMsg); }
  catch(e){ BANK.error = e.message; toast(e.message); }
  finally{ BANK.working = false; render(); }
}

const PLAID_KIND = {depository:"Checking", credit:"Credit card", loan:"Loan", investment:"Investment", brokerage:"Investment", other:"Other"};
function applyBankChanges(r){
  let added = 0;
  if(S.sample && ((r.accounts || []).length || (r.txns || []).length)){
    // real bank data replaces the made-up year
    S.sample = false; S.txns = []; S.accounts = []; S.bills = []; S.goals = [];
  }
  (r.accounts || []).forEach(a => {
    const id = "plaid:" + a.id, i = S.accounts.findIndex(x => x.id === id);
    if(a.removed){ if(i >= 0) S.accounts.splice(i, 1); return; }
    const owed = a.type === "credit" || a.type === "loan";
    const kind = a.type === "depository" && a.subtype === "savings" ? "Savings" : (PLAID_KIND[a.type] || "Other");
    const acct = {id, name:a.name + (a.mask ? " ••" + a.mask : ""), kind, balance:round2((owed ? -1 : 1) * (a.current || 0)), src:"plaid", inst:a.institution || ""};
    if(i >= 0) Object.assign(S.accounts[i], acct); else S.accounts.push(acct);
  });
  const byId = new Map(S.txns.map(t => [t.id, t])), drop = new Set();
  (r.txns || []).forEach(p => {
    const id = "plaid:" + p.id, have = byId.get(id);
    if(p.removed){ if(have) drop.add(id); return; }
    const merchant = String(p.merchant || p.name || "Bank transaction").slice(0, 60);
    const amount = round2(-p.amount);                    // Plaid counts money out as positive
    const fields = {date:p.date, merchant, amount, acct:"plaid:" + p.account, pending:!!p.pending, src:"plaid"};
    if(have){
      Object.assign(have, fields);
      if(!have.userCat && (catById(have.cat) || {}).name === "Uncategorized") have.cat = guessCat(merchant, amount > 0, p.category, p.detail);
      return;
    }
    const twin = findManualTwin(amount, p.date, merchant, drop);
    const t = Object.assign({id, cat: twin ? twin.cat : guessCat(merchant, amount > 0, p.category, p.detail), userCat: !!twin}, fields);
    if(twin) drop.add(twin.id);
    S.txns.push(t); byId.set(id, t); added++;
  });
  if(drop.size) S.txns = S.txns.filter(t => !drop.has(t.id));
  S.txns.sort((a,b)=> a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  return {added};
}
// a transaction typed by hand before the bank caught up: same amount, within 4 days, similar name
function findManualTwin(amount, date, merchant, taken){
  const d0 = Date.parse(date), key = merchant.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 4);
  return S.txns.find(t => t.src !== "plaid" && !taken.has(t.id) && Math.abs(t.amount - amount) < .005
    && Math.abs(Date.parse(t.date) - d0) <= 4 * 864e5
    && (!key || /^(cash|deposit)$/i.test(t.merchant) || t.merchant.toLowerCase().replace(/[^a-z0-9]/g, "").indexOf(key) >= 0)) || null;
}

function loadPlaidScript(){
  if(window.Plaid) return Promise.resolve(window.Plaid);
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.plaid.com/link/v2/stable/link-initialize.js";
    s.onload = () => window.Plaid ? res(window.Plaid) : rej(new Error("Plaid Link did not start."));
    s.onerror = () => rej(new Error("Could not load Plaid Link. Check your internet connection."));
    document.head.appendChild(s);
  });
}
async function openPlaid(itemId, resumeToken){
  const token = resumeToken || (await api("/api/link-token", {method:"POST", body:{itemId:itemId || undefined}})).link_token;
  try{ localStorage.setItem(LINK_TOKEN_KEY, JSON.stringify({token, itemId:itemId || null})); }catch(e){}
  const Plaid = await loadPlaidScript();
  return new Promise((resolve, reject) => {
    Plaid.create({
      token,
      receivedRedirectUri: resumeToken ? location.href : undefined,
      onSuccess: async (publicToken, meta) => {
        try{
          if(!itemId) await api("/api/items", {method:"POST", body:{public_token:publicToken, institution: meta && meta.institution ? meta.institution.name : null}});
          await syncBank(false);
          resolve(true);
        }catch(e){ reject(e); }
      },
      onExit: err => err ? reject(new Error(err.display_message || err.error_message || "The bank connection did not finish.")) : resolve(false)
    }).open();
  });
}
// OAuth banks send the browser away and back with ?oauth_state_id=…
async function resumeOAuth(){
  if(!LINK || !/[?&]oauth_state_id=/.test(location.search)) return;
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LINK_TOKEN_KEY) || "null"); }catch(e){}
  if(!saved) return;
  try{ if(await openPlaid(saved.itemId, saved.token)) toast("Bank connected"); }
  catch(e){ toast(e.message); }
  finally{ history.replaceState(null, "", location.pathname); }
}
function agoText(ts){
  if(!ts) return "not yet";
  const m = Math.round((Date.now() - ts) / 60000);
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m/60) + " h ago" : Math.round(m/1440) + " days ago";
}

/* ═══════════════════ bank statement files (no server needed) ═══════════════════ */
function parseOFX(text){
  const out = [], tag = (blk, name) => { const r = new RegExp("<" + name + ">([^<\\r\\n]*)", "i").exec(blk); return r ? r[1].trim() : ""; };
  const blocks = String(text).split(/<STMTTRN>/i).slice(1);
  blocks.forEach(raw => {
    const b = raw.split(/<\/STMTTRN>|<\/BANKTRANLIST>/i)[0];
    const amt = parseFloat(tag(b, "TRNAMT").replace(/,/g, "")), d = tag(b, "DTPOSTED");
    if(!isFinite(amt) || d.length < 8) return;
    const date = d.slice(0,4) + "-" + d.slice(4,6) + "-" + d.slice(6,8);
    const merchant = (tag(b, "NAME") || tag(b, "MEMO") || "Imported").replace(/&amp;/g, "&").slice(0, 60);
    const fitid = tag(b, "FITID");
    out.push({id: fitid ? "ofx:" + fitid : uid(), date, merchant, amount:round2(amt), cat:guessCat(merchant, amt > 0), acct:(S.accounts[0] || {}).id});
  });
  return out.length ? out : null;
}
const txnKey = t => t.date + "|" + round2(t.amount) + "|" + t.merchant.trim().toLowerCase();

async function authenticate(mode, server, email, password, invite){
  const h = await api("/api/health", {server});
  if(!h || !h.ok) throw new Error("That address did not answer like a Safe to Spend server.");
  const r = await api(mode === "signup" ? "/api/auth/signup" : "/api/auth/login", {server, method:"POST", body:{email, password, invite:invite || undefined}});
  LINK = {server, token:r.token, email:r.me.email, since:0, lastSync:0, plaid:!!h.plaid, plaidEnv:h.plaidEnv || "", billing:!!h.billing,
    items:[], me:r.me, meAt:Date.now()};
  saveLink();
}
async function refreshMe(){
  if(!LINK) return;
  try{
    const me = await api("/api/me");
    LINK.me = me; LINK.email = me.email; LINK.meAt = Date.now(); saveLink();
  }catch(e){
    if(e.status === 401 || e.status === 403){ LINK = null; saveLink(); if(e.status === 403) toast(e.message); }
    // otherwise offline: keep the last answer
  }
  render();
}
// the last answer from the server counts for two weeks offline, and a trial still ends on time
function hasAccess(){
  if(!APP.requireAccount) return true;
  const me = LINK && LINK.me;
  if(!me || !me.access || !me.access.active) return false;
  if(Date.now() - (LINK.meAt || 0) > 14 * 864e5) return false;
  const until = me.access.until && Date.parse(me.access.until);
  if(until && until < Date.now() && /trial/.test(me.access.reason)) return false;
  return true;
}

/* ═══════════════════ CSV export ═══════════════════ */
const csvCell = v => {
  let s = v == null ? "" : String(v);
  if(/^[=+\-@\t]/.test(s) && isNaN(+s)) s = "'" + s;   // a merchant name must never run as a spreadsheet formula
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
const csvNum = n => (Math.round((n || 0) * 100) / 100).toFixed(2);
function monthCSV(ym){
  const s = summary(ym), rows = [], add = (...cells) => rows.push(cells.map(csvCell).join(","));
  const totalBud = s.flexBud + s.fixedBud;
  add("Safe to Spend", ymLabel(ym)); add("");
  add("Summary"); add("Item", "Amount");
  add("Income", csvNum(s.income)); add("Spent", csvNum(s.allSpent)); add("Budgeted", csvNum(totalBud));
  add("Left in plan", csvNum(totalBud - s.allSpent)); add("Kept (income minus spending)", csvNum(s.income - s.allSpent));
  add("Safe to spend on everyday categories", csvNum(s.safe)); add("");

  add("Budget"); add("Group", "Category", "Budgeted", "Spent", "Left", "Status");
  GROUP_ORDER.filter(g => g !== "Income" && g !== "Transfers").forEach(g => {
    S.cats.filter(c => c.group === g && isSpendCat(c)).forEach(c => {
      const sp = s.spent[c.id] || 0;
      if(!c.budget && !sp) return;
      add(g, c.name, csvNum(c.budget), csvNum(sp), csvNum(c.budget - sp),
        c.budget <= 0 ? "No budget" : sp > c.budget ? "Over" : "On track");
    });
  });
  add("");

  const bills = billStates(ym);
  if(bills.length){
    add("Bills"); add("Bill", "Due", "Amount", "Status");
    bills.forEach(x => add(x.b.name, ym + "-" + pad(x.day), csvNum(x.paid ? -x.paid.amount : x.b.amount), stateLabel(x)));
    add("");
  }
  if(S.goals.length){
    add("Goals"); add("Goal", "Saved", "Target", "Monthly", "Finish by", "Status");
    S.goals.forEach(g => add(g.name, csvNum(g.saved), csvNum(g.target), csvNum(g.monthly), g.by || "", goalInfo(g).label));
    add("");
  }
  add("Transactions"); add("Date", "Merchant", "Category", "Account", "Amount", "Pending");
  txnsAll(ym).slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).forEach(t =>
    add(t.date, t.merchant, (catById(t.cat) || {}).name || "", (S.accounts.find(a => a.id === t.acct) || {}).name || "",
      csvNum(t.amount), t.pending ? "yes" : ""));
  return "﻿" + rows.join("\r\n") + "\r\n";            // the BOM makes Excel read it as UTF-8
}
async function saveMonthCSV(ym){
  const text = monthCSV(ym);
  const name = "safe-to-spend-" + MONTHS[parseYM(ym)[1]].toLowerCase() + "-" + ym.slice(0,4) + ".csv";
  // 1) inside Claude: the viewer's own save prompt
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){ dl = null; }
  if(dl){
    try{ await dl.save({filename:name, data:text}); markCSV(); toast("Saved " + name); }
    catch(e){
      if(e && e.code === "declined") return;
      if(e && e.code === "rate_limited"){ toast("A save prompt is already open."); return; }
      copyCSV(text, name);
    }
    return;
  }
  // 2) phones: the share sheet, so it can go straight to Messages, Mail or Drive
  try{
    const file = new File([text], name, {type:"text/csv"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); markCSV(); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  // 3) browsers: a normal download
  try{
    const url = URL.createObjectURL(new Blob([text], {type:"text/csv"}));
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    markCSV(); toast("Saved " + name);
    return;
  }catch(e){}
  copyCSV(text, name);
}
function markCSV(){ if(!S.csvSaved){ S.csvSaved = true; S.__touched = true; save(false); } }
function copyCSV(text, name){
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(() => toast("Copied " + name + " as text. Paste it into a spreadsheet."), () => toast("Could not save or copy the file here."));
  else toast("Could not save the file here.");
}

function moveCat(id, dir){
  const c = catById(id); if(!c) return;
  const same = S.cats.filter(x => x.group === c.group && isSpendCat(x) && !isUncatCat(x));
  const j = same.indexOf(c) + dir;
  if(j < 0 || j >= same.length) return;
  const a = S.cats.indexOf(c), b = S.cats.indexOf(same[j]);
  S.cats[a] = same[j]; S.cats[b] = c;
  S.__touched = true; save();
}

function addCategory(name, group, kind, budget){
  name = String(name || "").trim().replace(/\s+/g, " ").slice(0, 40);
  if(!name) return {error:"Give the category a name."};
  if(catByName(name)) return {error:"You already have a category called " + name + "."};
  const c = {id:uid(), name, group:USER_GROUPS.includes(group) ? group : "Family", kind:kind === "fixed" ? "fixed" : "flex",
    budget:Math.max(0, round2(budget || 0)), custom:true};
  S.cats.push(c); S.sample = false; S.__touched = true;
  // file earlier Uncategorized transactions that clearly belong here
  let moved = 0;
  S.txns.forEach(t => {
    if((catById(t.cat) || {}).name !== "Uncategorized" || t.userCat) return;
    if(guessCat(t.merchant, t.amount > 0) === c.id){ t.cat = c.id; moved++; }
  });
  return {cat:c, moved};
}

/* ═══════════════════ actions ═══════════════════ */
function moneyIn(str){
  const n = parseFloat(String(str).replace(/[^0-9.\-]/g,""));
  return isFinite(n) ? n : null;
}
function addTxn(t){
  S.sample = false; S.__touched = true;
  S.txns.push(t);
  S.txns.sort((a,b)=> a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
}
function avgSpendFor(catId){
  const cur = UI.month; let total = 0, months = 0;
  for(let i=1;i<=3;i++){
    const ym = shiftYM(cur,-i);
    if(!S.txns.some(t => monthOf(t.date) === ym)) continue;
    months++;
    total += txnsIn(ym).filter(t => t.cat === catId && !isIncome(t)).reduce((a,t)=>a-t.amount,0);
  }
  return months ? total / months : null;
}
function typicalIncome(){
  let total = 0, months = 0;
  for(let i=0;i<=3;i++){
    const ym = shiftYM(UI.month,-i);
    const t = txnsIn(ym);
    if(!t.length) continue;
    if(i === 0 && summary(ym).monthPct < .9) continue;  // this month isn't over yet
    months++; total += t.reduce((a,x)=> a + (isIncome(x) ? x.amount : 0), 0);
  }
  return months ? total / months : 0;
}

/* ═══════════════════ theme ═══════════════════ */
/* Preference is one of "system" | "light" | "dark". "system" stores nothing and
   leaves data-theme off the root, so the stylesheet's prefers-color-scheme block
   stays in charge; an explicit choice stamps the root and is re-applied before
   first paint by the inline script in <head>. */
const THEME_KEY = "safe-to-spend/theme";
const GROUND = {light:"#F4F6F7", dark:"#0E1519"};
const THEME_ICON = {
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.2v2.1M12 19.7v2.1M4.4 4.4l1.5 1.5M18.1 18.1l1.5 1.5M2.2 12h2.1M19.7 12h2.1M4.4 19.6l1.5-1.5M18.1 5.9l1.5-1.5"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.9 6.9 0 0 0 11.1 11.1z"/></svg>'
};
const darkMQ = matchMedia("(prefers-color-scheme:dark)");
function themePref(){
  try{ const v = localStorage.getItem(THEME_KEY); if(v === "light" || v === "dark") return v; }catch(e){}
  return "system";
}
function resolvedTheme(){
  const p = themePref();
  return p === "system" ? (darkMQ.matches ? "dark" : "light") : p;
}
function applyNativeChrome(now){
  // Native shells only. The StatusBar plugin overlays the webview by default, so the
  // page itself paints behind the status bar and its background is already correct;
  // the glyph colour is the one thing the web layer cannot set. Style.Dark means
  // "light text for dark backgrounds", so it pairs with the dark theme.
  const C = window.Capacitor;
  if(!C || typeof C.isNativePlatform !== "function" || !C.isNativePlatform()) return;
  const SB = C.Plugins && C.Plugins.StatusBar;
  if(!SB || typeof SB.setStyle !== "function") return;
  SB.setStyle({ style: now === "dark" ? "DARK" : "LIGHT" }).catch(() => {});
}
function applyTheme(){
  const pref = themePref(), now = resolvedTheme(), root = document.documentElement;
  if(pref === "system") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", pref);
  // Browser and OS chrome. In system mode each meta keeps its own ground; on an
  // explicit choice both carry the same one, so the media attributes cannot
  // hand the status bar a colour the page is not actually using.
  const L = document.getElementById("tc-light"), D = document.getElementById("tc-dark");
  if(L) L.setAttribute("content", pref === "system" ? GROUND.light : GROUND[now]);
  if(D) D.setAttribute("content", pref === "system" ? GROUND.dark  : GROUND[now]);
  applyNativeChrome(now);
  const label = pref === "system" ? "Theme: system" : pref === "light" ? "Theme: light" : "Theme: dark";
  document.querySelectorAll('[data-act="theme"]').forEach(b => {
    if(b.dataset.icon === "1"){
      b.innerHTML = THEME_ICON[now];
      b.setAttribute("aria-label", label + ". Change theme");
    }else{
      b.textContent = label;
      b.setAttribute("aria-label", label + ". Change theme");
    }
  });
}
function cycleTheme(){
  const next = {system:"light", light:"dark", dark:"system"}[themePref()];
  try{
    if(next === "system") localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, next);
  }catch(e){}
  applyTheme();
  toast(next === "system" ? "Following your device theme" : "Theme set to " + next);
}
darkMQ.addEventListener("change", () => { if(themePref() === "system") applyTheme(); });

document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if(nav){
    UI.view = nav.dataset.nav; UI.moveFrom = null; UI.askDel = null; UI.askWipe = false;
    render(); window.scrollTo(0,0); return;
  }
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  if(act === "theme"){ cycleTheme(); return; }
  if(act === "prevmo"){ UI.month = shiftYM(UI.month,-1); UI.moveFrom = null; render(); return; }
  if(act === "nextmo"){ UI.month = shiftYM(UI.month, 1); UI.moveFrom = null; render(); return; }

  if(act === "del"){
    const t = S.txns.find(x => x.id === id);
    S.txns = S.txns.filter(x => x.id !== id);
    S.__touched = true; save();
    if(t) toast("Deleted " + t.merchant);
    return;
  }
  if(act === "delacct"){
    S.accounts = S.accounts.filter(a => a.id !== id); S.__touched = true; save(); return;
  }
  if(act === "addacct"){ UI.acctForm = !UI.acctForm; render(); if(UI.acctForm){ const f = $("#acct-name"); if(f) f.focus(); } return; }

  if(act === "guidehide"){ S.guideHidden = true; S.__touched = true; save(); toast("Hidden. The Guide page is always in the menu."); return; }
  if(act === "catup" || act === "catdown"){ moveCat(id, act === "catup" ? -1 : 1); return; }
  if(act === "catedit"){ UI.editCat = UI.editCat === id ? null : id; UI.askDel = null; UI.moveFrom = null; render(); return; }
  if(act === "cattoggle"){ UI.catForm = !UI.catForm; render(); if(UI.catForm){ const f = $("#cat-name"); if(f) f.focus(); } return; }

    const p = CAT_PRESETS.find(x => x.n === el.dataset.name); if(!p) return;

  }
  if(act === "authmode"){ UI.authMode = UI.authMode === "signup" ? "signin" : "signup"; UI.authError = ""; render(); return; }
  if(act === "mecheck"){ refreshMe().then(() => toast(hasAccess() ? "You're all set" : "No active subscription yet. Payments can take a minute to show up.")); return; }
  if(act === "gatesignout"){ signOutHere(); return; }
  if(act === "pwtoggle"){ UI.pwForm = !UI.pwForm; render(); return; }
  if(act === "bankadd"){ bankAction(() => openPlaid(null).then(ok => { if(ok) toast("Bank connected"); })); return; }
  if(act === "bankfix"){ bankAction(() => openPlaid(id).then(ok => ok && syncBank(true))); return; }
  if(act === "restoreno"){ UI.restore = null; render(); return; }
  if(act === "restoreyes"){
    S = migrate(UI.restore); S.__touched = true; UI.restore = null;

  }
  if(act === "cfrange"){ UI.cfRange = +el.dataset.n || 6; render(); return; }
  if(act === "billtoggle"){ UI.billForm = !UI.billForm; render(); if(UI.billForm){ const f = $("#bill-name"); if(f) f.focus(); } return; }

  }
  if(act === "importconfirm"){
    const have = new Set(S.txns.map(t => t.id)), keys = new Set(S.txns.map(txnKey));
    const fallback = S.accounts.some(a => a.id === UI.importAcct) ? UI.importAcct : (S.accounts[0] || {}).id;
    const rows = (UI.importRows || []).filter(t => !have.has(t.id) && !keys.has(txnKey(t)));
    const skipped = (UI.importRows || []).length - rows.length;
    // Categories and accounts named in the file are created now, on confirm.
    let madeCats = 0, madeAccts = 0;
    rows.forEach(t => {
      if(!t.cat && t.catName){
        if(!catByName(cleanCatName(t.catName))) madeCats++;
        t.cat = ensureCat(t.catName, t.amount > 0);
      }
      if(!t.cat) t.cat = guessCat(t.merchant, t.amount > 0);
      if(!t.acct && t.acctName){
        if(!S.accounts.some(a => a.name.toLowerCase() === t.acctName.trim().toLowerCase())) madeAccts++;
        t.acct = ensureAcct(t.acctName);
      }
      if(!t.acct) t.acct = fallback;   // only rows the file did not place
      delete t.catName; delete t.acctName;
      addTxn(t);
    });
    UI.importRows = null; UI.importOpen = false; save();
    const extra = [];
    if(madeCats)  extra.push(madeCats + " new categor" + (madeCats===1?"y":"ies"));
    if(madeAccts) extra.push(madeAccts + " new account" + (madeAccts===1?"":"s"));
    if(skipped)   extra.push("skipped " + skipped + " you already had");
    toast("Imported " + rows.length + " transaction" + (rows.length===1?"":"s")
      + (extra.length ? " · " + extra.join(" · ") : ""));
    return;
  }
  if(act === "showuncat"){
    const c = catByName("Uncategorized");
    if(c){ UI.filterCat = c.id; render(); }
    return;
  }
  if(act === "export"){
    const text = JSON.stringify(S, null, 2);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=> toast("Copied to your clipboard"), ()=> toast("Could not reach the clipboard"));
    }else toast("Clipboard is not available here");
    return;
  }
  if(act === "wipe"){ UI.askWipe = true; render(); return; }
  if(act === "wipeno"){ UI.askWipe = false; render(); return; }
  if(act === "wipeyes"){
    const fresh = seed();
    fresh.sample = false;
    fresh.txns = []; fresh.rules = {}; fresh.bills = []; fresh.goals = [];
    fresh.cats.forEach(c => { c.budget = 0; });
    fresh.accounts = [{id:uid(), name:"Checking", kind:"Checking", balance:0}];
    S = fresh; S.__touched = true; UI.moveFrom = null; UI.askWipe = false; UI.view = "today";
    if(LINK){ LINK.since = 0; saveLink(); }                 // the next sync brings bank data back in full
    save();
    toast("Fresh start. Add your first transaction here.");
    return;
  }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("[data-act]");
  if(!f) return;
  e.preventDefault();
  if(f.dataset.act === "quickadd"){
    const input = $("#qa"), t = parseQuickAdd(input.value);
    if(!t){ toast("Add an amount, like “12 chipotle”"); input.focus(); return; }
    addTxn(t); save();
    const c = catById(t.cat);
    toast((t.amount > 0 ? "Added " : "Logged ") + usd(Math.abs(t.amount), true) + " · " + (c ? c.name : "Uncategorized"));
    const box = $("#qa"); if(box){ box.value = ""; box.focus(); }
    return;
  }
  if(f.dataset.act === "authform"){
    const server = normalizeServer(APP.server || (f.elements.url ? f.elements.url.value : defaultServer()));
    const email = f.elements.email.value.trim(), password = f.elements.password.value;
    const invite = f.elements.invite ? f.elements.invite.value.trim() : "";
    UI.authEmail = email; UI.authServer = f.elements.url ? f.elements.url.value : "";
    if(!server){ UI.authError = "Enter your server's address."; render(); return; }
    const go = $("#auth-go"); if(go){ go.disabled = true; go.textContent = UI.authMode === "signup" ? "Creating account…" : "Signing in…"; }
    authenticate(UI.authMode === "signup" ? "signup" : "signin", server, email, password, invite).then(() => {
      UI.authError = ""; UI.needInvite = false;
      render();
      toast(UI.authMode === "signup" ? "Welcome to Safe to Spend" : "Signed in as " + LINK.email);
      if(LINK.me && LINK.me.access && LINK.me.access.active) syncBank(false);
    }).catch(e => {
      UI.authError = e.message;
      if(e.code === "BAD_INVITE") UI.needInvite = true;
      if(e.code === "EMAIL_TAKEN") UI.authMode = "signin";
      render();
    });
    return;
  }
  if(f.dataset.act === "cateditform"){
    const c = catById(f.dataset.id); if(!c) return;
    const name = f.elements.name.value.trim().replace(/\s+/g, " ").slice(0, 40);
    if(!name){ toast("Give the category a name."); return; }
    const clash = S.cats.find(x => x.id !== c.id && x.name.toLowerCase() === name.toLowerCase());
    if(clash){ toast("You already have a category called " + clash.name + "."); return; }
    const group = USER_GROUPS.includes(f.elements.group.value) ? f.elements.group.value : c.group;
    if(group !== c.group){                                 // moving groups puts it at the end of the new one
      S.cats = S.cats.filter(x => x.id !== c.id); S.cats.push(c);
    }
    c.name = name; c.group = group; c.kind = f.elements.fixed.checked ? "fixed" : "flex";
    UI.editCat = null; S.__touched = true; save(); toast("Saved " + name);
    return;
  }
  if(f.dataset.act === "catform"){
    const r = addCategory(f.elements.name.value, f.elements.group.value, f.elements.fixed.checked ? "fixed" : "flex", moneyIn(f.elements.budget.value));
    if(r.error){ toast(r.error); return; }
    UI.catForm = false; save();
    toast("Added " + r.cat.name + (r.moved ? " and filed " + r.moved + " transaction" + (r.moved===1?"":"s") + " into it" : ""));
    return;
  }
  if(f.dataset.act === "pwform"){
    const current = f.elements.current.value, next = f.elements.next.value;
    if(next.length < 8){ toast("Use at least 8 characters for your new password."); return; }
    api("/api/auth/password", {method:"POST", body:{current, next}})
      .then(() => { UI.pwForm = false; toast("Password changed. Other devices were signed out."); return refreshMe(); })
      .catch(e => toast(e.message));
    return;
  }
  if(f.dataset.act === "acctform"){
    const name = f.elements.name.value.trim();
    if(!name){ toast("Give the account a name"); return; }
    S.accounts.push({id:uid(), name, kind:f.elements.kind.value, balance:round2(moneyIn(f.elements.bal.value) || 0)});
    UI.acctForm = false; S.__touched = true; save(); toast("Added " + name); return;
  }
  if(f.dataset.act === "billform"){
    const name = f.elements.name.value.trim(), amt = moneyIn(f.elements.amt.value), day = parseInt(f.elements.day.value, 10);
    if(!name || !amt || amt <= 0){ toast("Enter a name and an amount above zero"); return; }
    if(!(day >= 1 && day <= 31)){ toast("Pick a day between 1 and 31"); return; }
    S.bills.push({id:uid(), name, amount:round2(amt), day, cat:f.elements.cat.value});
    UI.billForm = false; S.__touched = true; save(); toast("Added " + name + " on day " + day); return;
  }
  if(f.dataset.act === "goalform"){
    const name = f.elements.name.value.trim(), target = moneyIn(f.elements.target.value);
    const by = f.elements.by.value.trim() ? parseYMInput(f.elements.by.value) : null;
    if(!name || !target || target <= 0){ toast("Enter a goal name and a target above zero"); return; }
    if(f.elements.by.value.trim() && !by){ toast("Write the finish date as YYYY-MM, like 2027-06"); return; }
    const vals = {name, target:round2(target), saved:round2(Math.max(0, moneyIn(f.elements.saved.value) || 0)),
      monthly:round2(Math.max(0, moneyIn(f.elements.monthly.value) || 0)), by};
    const g = f.dataset.id && S.goals.find(x => x.id === f.dataset.id);
    if(g) Object.assign(g, vals); else S.goals.push(Object.assign({id:uid(), history:[]}, vals));
    UI.goalForm = false; UI.goalEdit = null; S.__touched = true; save();
    toast(g ? "Saved " + name : "Created " + name); return;
  }
  if(f.dataset.act === "goaladdform"){
    const g = S.goals.find(x => x.id === f.dataset.id), amt = moneyIn(f.elements.amt.value);
    if(!g || !amt){ toast("Enter an amount, like 100 or -50"); return; }
    g.saved = round2(Math.max(0, g.saved + amt));
    (g.history = g.history || []).push({d:isoOf(today()), a:round2(amt)});
    if(g.history.length > 60) g.history = g.history.slice(-60);
    UI.goalAdd = null; S.__touched = true; save();
    toast((amt >= 0 ? "Added " : "Took out ") + usd(Math.abs(amt), true) + (amt >= 0 ? " to " : " from ") + g.name); return;
  }
  if(f.dataset.act === "moveform"){
    const from = catById(f.dataset.id);
    const amt = moneyIn(f.elements.amt.value);
    const to = catById(f.elements.to.value);
    if(!from || !to || !amt || amt <= 0){ toast("Enter an amount to move"); return; }
    from.budget = round2(Math.max(0, from.budget - amt));
    to.budget   = round2(to.budget + amt);
    UI.moveFrom = null; S.__touched = true; save();
    toast("Moved " + usd(amt) + " to " + to.name);
  }
});

document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  if(act === "setcat"){
    const t = S.txns.find(x => x.id === el.dataset.id);
    if(!t) return;
    t.cat = el.value; t.userCat = true;
    learn(t.merchant, t.cat);
    S.__touched = true; save();
    toast("Filed under " + ((catById(t.cat)||{}).name || "—") + " — and remembered for next time");
    return;
  }
  if(act === "filtercat"){ UI.filterCat = el.value; render(); return; }
  if(act === "importacct"){ UI.importAcct = el.value; return; }
  if(act === "budfile"){
    const file = el.files && el.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const rows = parseBudgetImport(String(reader.result || ""));
      if(!rows){ toast("Could not find budgets in " + file.name + "."); return; }
      UI.budRows = rows; UI.budImportOpen = true; render();
    };
    reader.onerror = () => toast("Could not read " + file.name + ".");
    reader.readAsText(file);
    el.value = "";
    return;
  }
  if(act === "importfile" || act === "restorefile"){
    const file = el.files && el.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result || "");
      if(act === "restorefile"){
        let p = null;
        try{ p = JSON.parse(text); }catch(e){}
        if(!p || !Array.isArray(p.cats) || !Array.isArray(p.txns)){ toast("That file is not a Safe to Spend backup."); return; }
        UI.restore = p; render(); return;
      }
      const rows = /<OFX|OFXHEADER/i.test(text) ? parseOFX(text) : parseImport(text, UI.importSign);
      if(!rows){ toast("Could not find transactions in " + file.name + "."); return; }
      UI.importRows = rows; render();
    };
    reader.onerror = () => toast("Could not read " + file.name + ".");
    reader.readAsText(file);
    el.value = "";
    return;
  }
  if(act === "importsign"){ UI.importSign = el.value; UI.importRows = null; render(); return; }
  if(act === "budget"){
    const c = catById(el.dataset.id), v = moneyIn(el.value);
    if(c){ c.budget = Math.max(0, round2(v === null ? c.budget : v)); S.__touched = true; save(); }
    return;
  }
  if(act === "bal"){
    const a = S.accounts.find(x => x.id === el.dataset.id), v = moneyIn(el.value);
    if(a){ a.balance = round2(v === null ? a.balance : v); S.__touched = true; save(); }
    return;
  }
});

document.addEventListener("input", e => {
  if(e.target.id === "search"){
    UI.search = e.target.value;
    clearTimeout(render._s);
    render._s = setTimeout(() => {
      const pos = e.target.selectionStart; render();
      const box = $("#search"); if(box){ box.focus(); box.setSelectionRange(pos,pos); }
    }, 180);
  }
});

document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.key === "Escape" && typing){ e.target.blur(); return; }
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === "n" || e.key === "N"){
    e.preventDefault();
    if(UI.view !== "today"){ UI.view = "today"; render(); }
    else if(!$("#qa")) render();
    const box = $("#qa"); if(box){ box.focus(); window.scrollTo(0,0); }
  }
  if(e.key === "/"){
    e.preventDefault();
    if(UI.view !== "txns"){ UI.view = "txns"; render(); }
    const box = $("#search"); if(box) box.focus();
  }
});

/* ═══════════════════ boot ═══════════════════ */
applyTheme();
S = load();
UI.importAcct = (S.accounts[0] || {}).id;
render();
if(IN_PREVIEW) initSync();
const stale = () => LINK && Date.now() - (LINK.lastSync || 0) > 10 * 60 * 1000;
const canSync = () => LINK && LINK.me && LINK.me.access && LINK.me.access.active;
if(!IN_PREVIEW){
  if(LINK){
    resumeOAuth();
    refreshMe().then(() => { if(canSync() && stale()) syncBank(false); });
  }else if(APP.requireAccount || defaultServer()){
    const server = normalizeServer(APP.server || defaultServer());
    if(server) api("/api/health", {server}).then(h => { UI.health = h; render(); }).catch(() => {});
  }
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState !== "visible" || !LINK) return;
    refreshMe().then(() => { if(canSync() && stale()) syncBank(false); });
  });
}
})();
</script>

</body></html>
