<!doctype html><html><head><meta charset=utf8><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" id="tc-light" media="(prefers-color-scheme: light)" content="#F4F6F7"><meta name="theme-color" id="tc-dark" media="(prefers-color-scheme: dark)" content="#0E1519"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Safe to Spend"><link rel="manifest" href="manifest.json"><script>try{var t=localStorage.getItem("safe-to-spend/theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}html,body{background:#F4F6F7;color:#0F1E25}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}:root:not([data-theme="light"]),:root:not([data-theme="light"]) body{background:#0E1519;color:#E9F1F4}}:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="dark"],:root[data-theme="dark"] body{background:#0E1519;color:#E9F1F4}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Safe to Spend</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* ─────────────────────────── tokens ─────────────────────────── */
:root{
  --bg:#F4F6F7; --bg-band:#EAEFF1;
  --surface:#FFFFFF; --surface-2:#EDF1F3; --surface-3:#E3EAED;
  --line:#D8E1E5; --line-soft:#E6ECEF; --line-strong:#BCCAD1;
  --ink:#0F1E25; --ink-2:#3C525C; --muted:#6D828C;
  --accent:#0B5D75; --accent-2:#0080A3; --on-accent:#FFFFFF; --accent-soft:#DFEDF2;
  --good:#3F7A55; --good-soft:#E3EFE7;
  --warn:#9C6F12; --warn-soft:#F5EDDB;
  --bad:#B03A26;  --bad-soft:#F8E5E1;
  --s1:#0080A3; --s2:#A8620F; --grid:#E2E9EC;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#4a3aa7; --c-other:#9AABB3;
  --shadow:0 1px 2px rgba(15,30,37,.05), 0 10px 28px -16px rgba(15,30,37,.22);
  --r:10px; --r-sm:7px;
  --ff-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --ff-body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ff-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1519; --bg-band:#131D22;
    --surface:#151E23; --surface-2:#1C282E; --surface-3:#233139;
    --line:#26363E; --line-soft:#1E2B32; --line-strong:#3A4E57;
    --ink:#E9F1F4; --ink-2:#B6C7CF; --muted:#889EA8;
    --accent:#4FB3D0; --accent-2:#1795B8; --on-accent:#05202A; --accent-soft:#16303A;
    --good:#63A87C; --good-soft:#162B20;
    --warn:#D6A03F; --warn-soft:#2D2416;
    --bad:#E2705A;  --bad-soft:#331C18;
    --s1:#1795B8; --s2:#BC7C24; --grid:#1F2D34;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c-other:#5A6E77;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1519; --bg-band:#131D22;
  --surface:#151E23; --surface-2:#1C282E; --surface-3:#233139;
  --line:#26363E; --line-soft:#1E2B32; --line-strong:#3A4E57;
  --ink:#E9F1F4; --ink-2:#B6C7CF; --muted:#889EA8;
  --accent:#4FB3D0; --accent-2:#1795B8; --on-accent:#05202A; --accent-soft:#16303A;
  --good:#63A87C; --good-soft:#162B20;
  --warn:#D6A03F; --warn-soft:#2D2416;
  --bad:#E2705A;  --bad-soft:#331C18;
  --s1:#1795B8; --s2:#BC7C24; --grid:#1F2D34;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c-other:#5A6E77;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}

/* ─────────────────────────── base ─────────────────────────── */
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ff-body); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--ff-display); margin:0; text-wrap:balance; letter-spacing:-.014em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--ff-mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--ff-mono); font-size:10.5px; font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--muted);
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ─────────────────────────── shell ─────────────────────────── */
.app{display:grid; grid-template-columns:214px minmax(0,1fr); min-height:100vh}
.rail{
  border-right:1px solid var(--line); background:var(--surface);
  display:flex; flex-direction:column; gap:4px; padding:18px 12px 14px;
  position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:9px; padding:2px 8px 16px}
.mark{
  width:26px;height:26px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;flex:none;
}
.mark span{
  font-family:var(--ff-display);font-weight:800;font-size:14px;color:var(--on-accent);line-height:1;
}
.brand b{font-family:var(--ff-display);font-weight:700;font-size:15px;letter-spacing:-.02em}
.navlink{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-sm);
  color:var(--ink-2); font-weight:500; width:100%; text-align:left;
}
.navlink svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navlink:hover{background:var(--surface-2); color:var(--ink)}
.navlink[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.btn.themebtn{display:none;width:32px;height:32px;padding:0;align-items:center;justify-content:center;flex:none}
.themebtn svg{width:16px;height:16px}
.rail-foot{margin-top:auto; padding:12px 8px 0; border-top:1px solid var(--line-soft); display:grid; gap:8px}
.syncdot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.syncdot i{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none}
.syncdot.on i{background:var(--good)}

main{min-width:0; padding:0 0 72px}
.topbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:16px 28px; border-bottom:1px solid var(--line);
  background:var(--bg); position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
}
.topbar h1{font-size:19px; font-weight:700}
.monthnav{display:flex; align-items:center; gap:2px; margin-left:auto}
.monthnav button{
  width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2);
}
.monthnav button:hover{background:var(--surface-2);color:var(--ink)}
.monthnav button[disabled]{opacity:.3;cursor:default}
.monthnav b{
  font-family:var(--ff-display);font-weight:600;font-size:13.5px;min-width:118px;text-align:center;
}
.wrap{max-width:1000px; padding:0 28px}
.view{display:grid; gap:26px; padding-top:24px}

/* ─────────────────────────── pace band ─────────────────────────── */
.band{
  border-bottom:1px solid var(--line); background:var(--bg-band);
  padding:26px 28px 22px; margin:0;
}
.band-in{max-width:1000px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:28px; align-items:end}
.hero-label{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hero{
  font-family:var(--ff-display); font-weight:800; font-size:clamp(40px,7vw,60px);
  line-height:.94; letter-spacing:-.035em; font-variant-numeric:tabular-nums;
}
.hero.over{color:var(--bad)}
.hero-sub{margin-top:9px; color:var(--ink-2); font-size:13.5px}
.hero-sub b{font-weight:600;color:var(--ink)}
.mini{display:flex; gap:26px; flex-wrap:wrap}
.mini div{display:grid; gap:3px}
.mini .v{font-family:var(--ff-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}

.pace{margin-top:20px; max-width:1000px}
.pace-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px}
.pace-head .lab{font-size:12.5px;color:var(--muted)}
.pace-head .st{font-size:12.5px;font-weight:600}
.pace-track{
  position:relative; height:12px; border-radius:6px; background:var(--surface-3); overflow:visible;
}
.pace-fill{height:12px; border-radius:6px; background:var(--good); transition:width .4s ease}
.pace-fill.warn{background:var(--warn)} .pace-fill.bad{background:var(--bad)}
.pace-mark{
  position:absolute; top:-5px; width:2px; height:22px; background:var(--ink);
  border-radius:1px; box-shadow:0 0 0 2px var(--bg-band);
}
.pace-mark::after{
  content:attr(data-l); position:absolute; top:24px; left:50%; transform:translateX(-50%);
  font-family:var(--ff-mono); font-size:10px; letter-spacing:.06em; color:var(--muted); white-space:nowrap;
}
.pace-legend{margin-top:26px; font-size:12px; color:var(--muted)}

/* ─────────────────────────── quick add ─────────────────────────── */
.qa{display:flex; gap:8px; align-items:center}
.qa-field{
  flex:1; display:flex; align-items:center; gap:9px; background:var(--surface);
  border:1px solid var(--line-strong); border-radius:var(--r); padding:0 12px;
  transition:border-color .15s, box-shadow .15s;
}
.qa-field:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.qa-field svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.qa-field input{border:none; background:none; outline:none; padding:11px 0; width:100%; font-size:14.5px}
.qa-hint{font-size:12px;color:var(--muted);margin-top:7px}
.qa-hint code{
  font-family:var(--ff-mono);font-size:11.5px;background:var(--surface-2);
  padding:1.5px 5px;border-radius:4px;color:var(--ink-2);
}

/* ─────────────────────────── buttons ─────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--r-sm);
  border:1px solid var(--line-strong); background:var(--surface); font-weight:600; font-size:13px;
  color:var(--ink); white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn-p{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn-p:hover{background:var(--accent-2); border-color:var(--accent-2)}
.btn-s{padding:6px 10px; font-size:12px; font-weight:500}
.btn-d:hover{color:var(--bad); border-color:var(--bad)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ─────────────────────────── section ─────────────────────────── */
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{font-size:15px;font-weight:700}
.sec-head .tools{margin-left:auto;display:flex;gap:7px;align-items:center}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.empty{padding:28px 16px; text-align:center; color:var(--muted); font-size:13px}

/* ─────────────────────────── ledger rows ─────────────────────────── */
.rows{display:grid}
.row{
  display:grid; grid-template-columns:62px minmax(0,1fr) auto auto 26px;
  gap:12px; align-items:center; padding:9px 14px;
  border-top:1px solid var(--line-soft);
}
.rows .row:first-child{border-top:none}
.row:hover{background:var(--surface-2)}
.row .date{font-family:var(--ff-mono);font-size:11.5px;color:var(--muted);letter-spacing:-.02em}
.row .who{min-width:0}
.row .who .m{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .who .a{font-size:11.5px;color:var(--muted)}
.row .amt{
  font-family:var(--ff-mono); font-size:13px; font-weight:500; font-variant-numeric:tabular-nums;
  text-align:right; white-space:nowrap;
}
.row .amt.in{color:var(--good)}
.rowbtn{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--muted);opacity:0}
.row:hover .rowbtn,.rowbtn:focus-visible{opacity:1}
.rowbtn:hover{background:var(--surface-3);color:var(--bad)}
.rowbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.catsel{
  font-family:var(--ff-body); font-size:11.5px; font-weight:500; padding:3px 20px 3px 8px;
  border-radius:20px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  appearance:none; max-width:150px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 11px) 52%, calc(100% - 7px) 52%;
  background-size:4px 4px, 4px 4px; background-repeat:no-repeat;
}
.catsel:hover{border-color:var(--line-strong)}
.catsel.uncat{border-color:var(--warn);color:var(--warn);background-color:var(--warn-soft)}

/* ─────────────────────────── envelopes ─────────────────────────── */
.grp{margin-bottom:18px}
.grp-head{
  display:flex;align-items:baseline;gap:10px;padding:0 2px 8px;border-bottom:1px solid var(--line);
  margin-bottom:2px;
}
.grp-head .tot{margin-left:auto;font-family:var(--ff-mono);font-size:11.5px;color:var(--muted)}
.env{padding:12px 2px 13px; border-bottom:1px solid var(--line-soft)}
.env:last-child{border-bottom:none}
.env-top{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.env-name{font-weight:600;font-size:13.5px}
.env-fig{margin-left:auto;display:flex;align-items:baseline;gap:5px;font-family:var(--ff-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.env-fig .sp{font-weight:600}
.env-fig .of{color:var(--muted)}
.budinput{
  width:72px;padding:2px 6px;border:1px solid transparent;border-radius:5px;background:none;
  font-family:var(--ff-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;
}
.budinput:hover{border-color:var(--line-strong);background:var(--surface)}
.budinput:focus{border-color:var(--accent);background:var(--surface);outline:none}
.bar{height:8px;border-radius:4px;background:var(--surface-3);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;height:8px;border-radius:4px;display:block}
.bar i.good{background:var(--good)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.bar .tick{position:absolute;top:-2px;width:2px;height:12px;background:var(--ink-2);opacity:.5}
.env-foot{display:flex;align-items:center;gap:8px 10px;margin-top:7px;flex-wrap:wrap}
.pill{
  font-family:var(--ff-mono);font-size:10.5px;font-weight:500;letter-spacing:.03em;
  padding:2px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;
}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.env-foot .mv{font-size:12px;color:var(--muted);font-weight:500}
.env-tools{margin-left:auto;display:flex;align-items:center;gap:12px}
.arw{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--muted);font-size:13px;border:1px solid var(--line)}
.arw:hover:not([disabled]){color:var(--accent);border-color:var(--accent)}
.arw[disabled]{opacity:.3;cursor:default}
.env-foot .mv:hover{color:var(--accent)}
.move{
  margin-top:10px;padding:11px 12px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;
}
.move input,.move select{
  padding:5px 8px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);font-size:12.5px;
}
.move input{width:82px;font-family:var(--ff-mono);text-align:right}

/* ─────────────────────────── charts ─────────────────────────── */
.cbars{display:grid;gap:11px}
.cbar{display:grid;grid-template-columns:118px minmax(0,1fr) 74px;gap:12px;align-items:center;cursor:default}
.cbar .n{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.cbar .t{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.cbar .f{height:14px;border-radius:4px;background:var(--s1);transition:opacity .15s}
.cbar:hover .f{opacity:.78}
.cbar .v{font-family:var(--ff-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.tip{
  position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r-sm);box-shadow:var(--shadow);padding:8px 10px;font-size:12px;z-index:30;
  min-width:120px;opacity:0;transition:opacity .12s;
}
.tip.on{opacity:1}
.tip b{display:block;font-family:var(--ff-display);font-size:12px;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-family:var(--ff-mono);font-size:11.5px}
.tip .r i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
details.tbl{margin-top:14px;font-size:12.5px}
details.tbl summary{color:var(--muted);cursor:pointer;font-size:12px}
details.tbl table{border-collapse:collapse;margin-top:9px;width:100%;font-family:var(--ff-mono);font-size:11.5px}
details.tbl th,details.tbl td{text-align:right;padding:4px 8px;border-bottom:1px solid var(--line-soft)}
details.tbl th:first-child,details.tbl td:first-child{text-align:left}
details.tbl th{color:var(--muted);font-weight:500}

/* ─────────────────────────── misc ─────────────────────────── */
.scroll-x{overflow-x:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r-sm);padding:0 10px;flex:1;min-width:160px;
}
.search svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
.search input{border:none;background:none;outline:none;padding:8px 0;width:100%;font-size:13px}
.sel{
  padding:8px 28px 8px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface);font-size:13px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 54%, calc(100% - 11px) 54%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.acct{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-soft)}
.acct:first-child{border-top:none}
.acct .n{font-weight:600;font-size:13.5px}
.acct .k{font-size:11.5px;color:var(--muted)}
.acct input{
  width:120px;padding:5px 8px;border:1px solid transparent;border-radius:5px;background:none;text-align:right;
  font-family:var(--ff-mono);font-size:13px;font-variant-numeric:tabular-nums;
}
.acct input:hover{border-color:var(--line-strong);background:var(--surface-2)}
.acct input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.nw{display:flex;align-items:baseline;gap:12px;padding:14px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.nw .v{margin-left:auto;font-family:var(--ff-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.bill{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-soft)}
.bill:first-child{border-top:none}
.bill .d{
  width:38px;text-align:center;border-radius:6px;background:var(--surface-2);padding:3px 0;
  font-family:var(--ff-mono);font-size:11px;line-height:1.25;color:var(--ink-2);
}
.bill .d b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.bill.due .d{background:var(--warn-soft);color:var(--warn)}
.bill.due .d b{color:var(--warn)}
.bill .n{font-weight:500;font-size:13.5px}
.bill .s{font-size:11.5px;color:var(--muted)}
.bill .a{font-family:var(--ff-mono);font-size:12.5px;font-variant-numeric:tabular-nums}

.import{display:grid;gap:10px}
.import textarea{
  width:100%;min-height:112px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface);font-family:var(--ff-mono);font-size:12px;resize:vertical;outline:none;
}
.import textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.prev{font-family:var(--ff-mono);font-size:11.5px;border-collapse:collapse;width:100%}
.prev th,.prev td{padding:5px 9px;border-bottom:1px solid var(--line-soft);text-align:left;white-space:nowrap}
.prev th{color:var(--muted);font-weight:500}
.prev td.a{text-align:right}
.note{font-size:12.5px;color:var(--muted)}
.banner{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:var(--r);
  background:var(--accent-soft);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);
}
.banner b{color:var(--ink);font-weight:600}
.banner .btn{margin-left:auto}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:13px;font-weight:500;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kbd{
  font-family:var(--ff-mono);font-size:10.5px;border:1px solid var(--line-strong);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;color:var(--muted);
}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:26px;align-items:start}
.half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;align-items:start}

/* ─────────────────────────── dashboard ─────────────────────────── */
.greet h2{font-size:23px;font-weight:700}
.greet p{margin:5px 0 0;color:var(--ink-2);max-width:68ch}
.greet p b{color:var(--ink);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;
}
.card-h{display:flex;align-items:baseline;gap:10px}
.card-h h2{font-size:14px;font-weight:700}
.lnk{margin-left:auto;font-size:12px;color:var(--accent);font-weight:600}
.lnk:hover{text-decoration:underline}
.big{font-family:var(--ff-display);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.delta{font-size:12.5px;color:var(--ink-2)}
.delta b{font-weight:600}
.delta b.up{color:var(--good)} .delta b.down{color:var(--bad)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line-soft)}
.mrow:first-child{border-top:none;padding-top:0}
.mrow .m{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .s{font-size:11.5px;color:var(--muted)}
.mrow .a{font-family:var(--ff-mono);font-size:12.5px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mrow .a.in{color:var(--good)}
.prog{display:grid;gap:6px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--ink-2)}
.prog-top b{font-family:var(--ff-mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.statline{display:flex;gap:22px;flex-wrap:wrap}
.statline div{display:grid;gap:2px}
.statline .v{font-family:var(--ff-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.xh{stroke:var(--ink-2);stroke-width:1;opacity:0;pointer-events:none}
.hv{fill:transparent;cursor:crosshair}

/* ─────────────────────────── tiles & toggles ─────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;min-width:0}
.tile .v{font-family:var(--ff-display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .s{font-size:11.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{padding:6px 11px;font-size:12px;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.share{font-family:var(--ff-mono);font-size:11px;color:var(--muted);margin-left:6px}

/* ─────────────────────────── recurring ─────────────────────────── */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-family:var(--ff-mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-align:center;padding-bottom:2px}
.cday{
  min-height:78px;background:var(--surface);border:1px solid var(--line-soft);border-radius:6px;
  padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;
}
.cday.blank{background:none;border-color:transparent}
.cday .dn{font-family:var(--ff-mono);font-size:11px;color:var(--muted)}
.cday.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cday.now .dn{color:var(--accent);font-weight:600}
.chip{
  font-size:10.5px;line-height:1.35;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;background:var(--surface-2);color:var(--ink-2);
}
.chip.paid{background:var(--good-soft);color:var(--good)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.late,.chip.missed{background:var(--bad-soft);color:var(--bad)}
.rbill{display:grid;grid-template-columns:38px minmax(0,1fr) auto auto 26px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-soft)}
.rbill:first-child{border-top:none}
.rbill:hover{background:var(--surface-2)}
.rbill:hover .rowbtn{opacity:1}
.rbill .d{width:38px;text-align:center;border-radius:6px;background:var(--surface-2);padding:3px 0;font-family:var(--ff-mono);font-size:11px;line-height:1.25;color:var(--ink-2)}
.rbill .d b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.rbill .n{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbill .s{font-size:11.5px;color:var(--muted)}
.rbill .a{font-family:var(--ff-mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.pill.info{background:var(--surface-2);color:var(--ink-2)}
.rbill.sugg{grid-template-columns:38px minmax(0,1fr) auto auto}

/* ─────────────────────────── forms ─────────────────────────── */
.fgrid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r)}
.f{display:grid;gap:4px;font-size:11.5px;color:var(--muted);font-weight:500;min-width:0}
.f input,.f select{
  padding:7px 9px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);
  font-size:13px;color:var(--ink);min-width:0;width:100%;
}
.f input:focus,.f select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.f.w1{flex:2 1 170px} .f.w2{flex:1 1 100px} .f.w3{flex:0 1 80px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--bad);font-weight:500}

/* ─────────────────────────── goals ─────────────────────────── */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:11px;min-width:0}
.goal-top{display:flex;align-items:baseline;gap:10px}
.goal-top h3{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-top .pct{margin-left:auto;font-family:var(--ff-mono);font-size:12px;color:var(--muted)}
.goal .fig{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.goal .fig .big{font-size:24px}
.goal .fig .of{font-size:12.5px;color:var(--muted)}
.gbar{height:10px;border-radius:5px;background:var(--surface-3);position:relative;overflow:hidden}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--s1)}
.goal dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:12.5px}
.goal dt{color:var(--muted)}
.goal dd{margin:0;text-align:right;font-family:var(--ff-mono);font-size:12px;font-variant-numeric:tabular-nums}
.goal-act{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.goal .fgrid{padding:10px}

/* ─────────────────────────── donut ─────────────────────────── */
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut .slice{transition:opacity .15s}
.donut .chartbox:hover .slice{opacity:.55}
.donut .chartbox:hover .slice:hover{opacity:1}
.dlegend{list-style:none;margin:0;padding:0;display:grid;gap:8px;flex:1;min-width:190px;max-width:380px}
.dlegend li{display:grid;grid-template-columns:10px minmax(0,1fr) auto 38px;gap:9px;align-items:center;font-size:13px}
.dlegend i{width:10px;height:10px;border-radius:3px}
.dlegend .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.dlegend .v{font-family:var(--ff-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.dlegend .p{font-family:var(--ff-mono);font-size:11.5px;color:var(--muted);text-align:right}

/* ─────────────────────────── getting started & guide ─────────────────────────── */
.setup{border-color:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px 18px}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start}
.steps .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--on-accent)}
.steps li.ok .chk{background:var(--good);border-color:var(--good)}
.steps li.ok .lnk{color:var(--ink-2);text-decoration:line-through}
.guide-wrap{max-width:760px}
.guide h2{font-size:16px;margin-bottom:8px}
.guide p,.guide li,.guide dd{color:var(--ink-2);line-height:1.6}
.guide p{margin:0 0 10px}
.guide ol,.guide ul{margin:0;padding-left:20px;display:grid;gap:8px}
.guide .lnk{margin:0;font-size:inherit}
.guide code{font-family:var(--ff-mono);font-size:12.5px;background:var(--surface-2);padding:1.5px 6px;border-radius:4px;color:var(--ink)}
.gtable{border-collapse:collapse;margin:4px 0 12px;font-size:13px;width:100%}
.gtable td{padding:7px 8px;border-top:1px solid var(--line-soft);color:var(--ink-2)}
.gtable td:first-child{white-space:nowrap;width:1%}
.faq{margin:0;display:grid;gap:4px}
.faq dt{font-weight:600;margin-top:8px}
.faq dd{margin:0}

/* ─────────────────────────── sign-in & paywall ─────────────────────────── */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.gate-card{width:min(100%,440px);display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;box-shadow:var(--shadow)}
.gate .brand{display:flex}
.gate-card h1{font-size:23px;font-weight:800;letter-spacing:-.025em}
.gate-card p{margin:0}
.gate-form{display:grid;gap:11px}
.gate-form .btn-p{justify-content:center;padding:11px 14px}
.gate-err{color:var(--bad);font-size:12.5px;font-weight:500}
.plan-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.plan{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--surface-2)}
.plan .big{font-size:24px}
.plan .btn{justify-content:center}

/* ─────────────────────────── responsive ─────────────────────────── */
@media (max-width:900px){
  .two,.half,.cards{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .band-in{grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{
    position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:40;
    flex-direction:row;border-right:none;border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;
  }
  .rail{overflow-x:auto;scrollbar-width:none}
  .rail .brand,.rail-foot{display:none}
  .btn.themebtn{display:inline-flex}
  .navlink{flex:0 0 auto;min-width:70px;width:auto;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;padding:6px 4px;justify-content:center;text-align:center;white-space:nowrap}
  .cday{min-height:46px;padding:4px}
  .chip{font-size:0;padding:0;width:7px;height:7px;border-radius:50%;background:currentColor}
  .chip.paid,.chip.soon,.chip.late,.chip.missed{background:currentColor}
  .rbill{grid-template-columns:38px minmax(0,1fr) auto 26px;row-gap:4px}
  .rbill .pill{grid-column:2/4;grid-row:2;justify-self:start}
  .rbill .rowbtn{opacity:1}
  .rbill.sugg{grid-template-columns:38px minmax(0,1fr) auto auto}
  .big{font-size:26px}
  .navlink svg{width:19px;height:19px}
  main{padding-bottom:86px}
  .wrap,.topbar{padding-left:16px;padding-right:16px}
  .band{padding:20px 16px 18px}
  .topbar h1{font-size:17px}
  .row{grid-template-columns:52px minmax(0,1fr) auto 26px;row-gap:5px;gap:9px}
  .row .date,.row .who,.row .amt,.row .rowbtn{grid-row:1}
  .row .cat{grid-column:2/5;grid-row:2}
  .rowbtn{opacity:1}
  .cbar{grid-template-columns:96px minmax(0,1fr) 66px;gap:9px}
}
</style>

(function(){

/* ═══════════════════ build settings (config.js) ═══════════════════ */

// one-tap suggestions on the Budget page; kind "fixed" keeps a bill out of Safe to spend
const CAT_PRESETS = [
  {n:"Childcare & daycare", g:"Family",        k:"fixed"},
  {n:"School & kids",       g:"Family",        k:"flex"},

function seed(){
  const rnd = mulberry32(20260901);
  const cats = SEED_CATS.map(c => ({id:uid(), name:c.n, key:c.n, group:c.g, kind:c.k, budget:c.b}));
  const byName = {}; cats.forEach(c => byName[c.name] = c.id);
  const accts = SEED_ACCOUNTS.map(a => ({id:uid(), name:a.n, kind:a.k, balance:a.bal}));
  const checking = accts[0].id, card = accts[2].id;
  const txns = [];
  const now = today(), curYM = ymOf(now), curDay = now.getDate();

  for(let back=11; back>=0; back--){
    const ym = shiftYM(curYM, -back), [y,m] = parseYM(ym);
    const dim = daysIn(ym), lastDay = (ym===curYM) ? curDay : dim;
    const add = (day, merchant, amount, catName, acct) => {
      if(day > lastDay || day < 1) return;
      txns.push({id:uid(), date:y+"-"+pad(m+1)+"-"+pad(day), merchant, amount:round2(amount),
                 cat:byName[catName], acct:acct||checking});
    };
    BILLS.forEach(b => add(b.d, b.n, -b.a, b.c, b.n==="Bayview Apartments"?checking:card));
    add(15, "Northwind Labs payroll", 2640, "Paycheck", checking);
    add(dim, "Northwind Labs payroll", 2640, "Paycheck", checking);
    if(rnd() < .45) add(2 + Math.floor(rnd()*24), "Freelance invoice", 180 + Math.floor(rnd()*420), "Side income", checking);

    const counts = {"Groceries":[8,11],"Dining out":[10,16],"Transport":[6,10],"Health":[1,3],"Shopping":[3,6],"Fun":[3,6],"Home":[1,3]};
    Object.keys(counts).forEach(catName => {
      const [lo,hi] = counts[catName];
      let n = lo + Math.floor(rnd()*(hi-lo+1));
      if(ym===curYM){
        // a partial month gets a proportional slice, rounded probabilistically so
        // early-in-the-month never piles a whole month of spending onto day one
        const exact = n * (lastDay/dim);
        n = Math.floor(exact) + (rnd() < (exact % 1) ? 1 : 0);
      }
      for(let i=0;i<n;i++){
        const list = MERCHANTS[catName], pick = list[Math.floor(rnd()*list.length)];
        const amt = pick[1] + rnd()*(pick[2]-pick[1]);
        add(1 + Math.floor(rnd()*lastDay), pick[0], -Math.round(amt*100)/100, catName, rnd()<.55?card:checking);
      }
    });
  }
  txns.sort((a,b)=> a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  return {
    v:1, sample:true, updatedAt:Date.now(),
    cats, accounts:accts, txns, rules:{},
    bills: BILLS.map(b => ({id:uid(), name:b.n, amount:b.a, day:b.d, cat:byName[b.c]})),
    goals: seedGoals()
  };
}

function migrate(p){

  // card payments and moves between your own accounts are neither spending nor income
  if(!p.cats.some(c => c.kind === "transfer")) p.cats.push({id:uid(), name:"Transfers", key:"Transfers", group:"Transfers", kind:"transfer", budget:0});
  p.cats.forEach(c => { if(!c.key && !c.custom) c.key = c.name; });
  return p;

  }catch(e){}

function save(rerender){
  S.updatedAt = Date.now();
  persistLocal();
  if(db && !applyingRemote){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(pushRemote, 700);
  }
  if(rerender !== false) render();
}
function trimmed(){
  // keep the document comfortably inside the 256 KiB per-document ceiling
  const cutoff = shiftYM(ymOf(today()), -23);
  const copy = Object.assign({}, S);
  if(JSON.stringify(S).length > 200000) copy.txns = S.txns.filter(t => monthOf(t.date) >= cutoff);
  return copy;
}
async function pushRemote(){
  if(!db) return;
  try{ await db.doc("app/state").set(trimmed()); setSync(true,"Synced across your devices"); }
  catch(e){ setSync(false, e && e.code === "quota_exceeded" ? "Sync full — saved on this device" : "Saved on this device"); }
}
function setSync(on, text){
  const el = $("#sync"); if(!el) return;
  el.classList.toggle("on", !!on);
  el.lastElementChild.textContent = text;
}
async function initSync(){
  let cap = null;
  try{ cap = await window.claude.use("db"); }catch(e){ cap = null; }
  if(!cap) return;
  db = cap;
  try{
    const snap = await db.doc("app/state").get();
    const remote = snap.exists ? snap.data() : null;
    if(remote && remote.cats && remote.txns && (remote.updatedAt||0) > (S.updatedAt||0) && !S.__touched){
      applyingRemote = true; S = migrate(remote); persistLocal(); applyingRemote = false; render();
    }else{
      await pushRemote();
    }
    setSync(true,"Synced across your devices");
    db.doc("app/state").onSnapshot(s => {
      if(!s.exists || s.metadata.hasPendingWrites) return;
      const d = s.data();
      if(d && d.cats && d.txns && (d.updatedAt||0) > (S.updatedAt||0)){
        applyingRemote = true; S = migrate(d); persistLocal(); applyingRemote = false; render();
      }
    }, () => setSync(false,"Saved on this device"));
  }catch(e){ setSync(false,"Saved on this device"); }
}

const catById = id => S.cats.find(c => c.id === id) || null;
const catByName = n => { const k = String(n).toLowerCase();
  return S.cats.find(c => c.name.toLowerCase() === k) || S.cats.find(c => c.key && c.key.toLowerCase() === k) || null; };
const isUncatCat = c => !!c && (c.key === "Uncategorized" || c.name === "Uncategorized");
const uncatId = () => (catByName("Uncategorized") || S.cats[0]).id;
const isSpendCat = c => !!c && (c.kind === "flex" || c.kind === "fixed");
const isXfer = t => { const c = catById(t.cat); return !!c && c.kind === "transfer"; };
// every report works off txnsIn, which leaves transfers out; the ledger uses txnsAll
const txnsIn  = ym => S.txns.filter(t => monthOf(t.date) === ym && !isXfer(t));
const txnsAll = ym => S.txns.filter(t => monthOf(t.date) === ym);
const isIncome = t => { const c = catById(t.cat); return c ? c.kind === "income" : t.amount > 0; };

function spendByCat(ym){
  const m = {};
  txnsIn(ym).forEach(t => { if(!isIncome(t)) m[t.cat] = (m[t.cat]||0) + Math.max(0, -t.amount); });
  return m;
}
function summary(ym){
  const spent = spendByCat(ym);
  const list = S.cats.filter(c => isSpendCat(c));
  let flexBud=0, flexSpent=0, fixedBud=0, fixedSpent=0;
  list.forEach(c => {
    const s = spent[c.id] || 0;
    if(c.kind === "flex"){ flexBud += c.budget; flexSpent += s; } else { fixedBud += c.budget; fixedSpent += s; }
  });
  const income = txnsIn(ym).reduce((a,t)=> a + (isIncome(t) ? t.amount : 0), 0);
  const dim = daysIn(ym), now = today(), cur = ymOf(now) === ym;
  const dayNow  = cur ? now.getDate() : (ym > ymOf(now) ? 0 : dim);
  const daysLeft = cur ? Math.max(1, dim - dayNow + 1) : (ym > ymOf(now) ? dim : 0);
  return {
    spent, flexBud, flexSpent, fixedBud, fixedSpent, income, dim, daysLeft, cur, dayNow,
    safe: flexBud - flexSpent,
    allSpent: flexSpent + fixedSpent,
    billsLeft: Math.max(0, fixedBud - fixedSpent),
    monthPct: dim ? clamp(dayNow / dim, 0, 1) : 1
  };
}
function envStatus(spent, budget, monthPct){
  if(budget <= 0) return spent > 0 ? "warn" : "good";
  const pct = spent / budget;
  if(pct > 1) return "bad";
  if(pct > monthPct * 1.15 + .05) return "warn";
  return "good";
}

function guessCat(merchant, incomeHint, plaidPrimary, plaidDetail){
  const key = String(merchant).trim().toLowerCase();
  if(S.rules[key] && catById(S.rules[key])) return S.rules[key];
  const mapped = catByName(PLAID_DETAIL[plaidDetail] || PLAID_PRIMARY[plaidPrimary] || "");
  if(mapped) return mapped.id;
  for(const [re,name] of KEYWORDS){
    if(re.test(merchant)){
      const c = catByName(name);
      if(c && (!incomeHint || c.kind === "income")) return c.id;
      if(c && incomeHint && c.kind !== "income") continue;
      if(c) return c.id;
    }
  }
  if(incomeHint){ const c = catByName("Side income"); if(c) return c.id; }
  return uncatId();
}

/* ═══════════════════ quick add parsing ═══════════════════ */
function parseQuickAdd(raw){
  let s = " " + raw.trim() + " ";
  if(!s.trim()) return null;
  let forced = null;
  s = s.replace(/#([a-z0-9 &'-]+?)\s*$/i, (m,c) => { forced = c.trim(); return " "; });

  let date = isoOf(today());
  if(/\byesterday\b/i.test(s)){
    const d = today(); d.setDate(d.getDate()-1); date = isoOf(d);
    s = s.replace(/\byesterday\b/i," ");
  }
  const dm = s.match(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s/);
  if(dm){
    const y = dm[3] ? (dm[3].length===2 ? 2000+ +dm[3] : +dm[3]) : today().getFullYear();
    const d = new Date(y, +dm[1]-1, +dm[2]);
    if(!isNaN(d)) { date = isoOf(d); s = s.replace(dm[0], " "); }
  }
  const am = s.match(/([+-])?\s*\$?\s*(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)/);
  if(!am) return null;
  const income = am[1] === "+";
  const value = parseFloat(am[2].replace(/,/g,""));
  if(!isFinite(value) || value <= 0) return null;

  let merchant = (s.slice(0, am.index) + " " + s.slice(am.index + am[0].length)).replace(/\s+/g," ").trim();
  if(!merchant) merchant = income ? "Deposit" : "Cash";

  let cat = null;
  if(forced){
    const f = forced.toLowerCase();
    const exact = catByName(forced) ||
      S.cats.find(c => c.name.toLowerCase().indexOf(f) === 0) ||
      S.cats.find(c => c.name.toLowerCase().split(/[^a-z0-9]+/).some(w => w && w.indexOf(f) === 0)) ||
      S.cats.find(c => c.name.toLowerCase().indexOf(f) >= 0);
    if(exact) cat = exact.id;
  }
  if(!cat) cat = guessCat(merchant, income);
  const acct = (S.accounts[0] || {}).id;
  return {id:uid(), date, merchant, amount: income ? value : -value, cat, acct};
}

/* ═══════════════════ CSV parsing ═══════════════════ */
function splitRows(text){
  const lines = text.replace(/\r\n?/g,"\n").split("\n").filter(l => l.trim());
  if(!lines.length) return [];
  const first = lines[0];
  const delim = (first.split("\t").length > first.split(",").length) ? "\t" : ",";
  return lines.map(line => {
    const out = []; let cur = "", q = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(q){
        if(ch === '"' && line[i+1] === '"'){ cur += '"'; i++; }
        else if(ch === '"') q = false;
        else cur += ch;
      }else if(ch === '"') q = true;
      else if(ch === delim){ out.push(cur.trim()); cur = ""; }
      else cur += ch;
    }
    out.push(cur.trim());
    return out;
  });
}
function asDate(v){
  if(!v) return null;
  const s = v.trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){ const y = m[3].length===2 ? 2000+ +m[3] : +m[3]; return y+"-"+pad(+m[1])+"-"+pad(+m[2]); }
  const d = new Date(s);
  if(!isNaN(d) && /\d/.test(s) && s.length > 5) return isoOf(d);
  return null;
}
function asNum(v){
  if(v == null) return null;
  let s = String(v).trim();
  if(!s || !/\d/.test(s)) return null;
  let neg = /^\(.*\)$/.test(s);
  s = s.replace(/[()]/g,"").replace(/[$,\s]/g,"");
  if(!/^-?\d*\.?\d+$/.test(s)) return null;
  const n = parseFloat(s);
  return isFinite(n) ? (neg ? -n : n) : null;
}
/* ═══════════════ moving in from another budgeting app ═══════════════
   Other apps export the category and account you already chose. The positional
   importer below throws those away, so read the header row when there is one and
   keep them; fall back to the heuristic for headerless bank CSVs. */
const H_ALIASES = {
  date:     ["date","transaction date","posted date","post date","date posted","completed date"],
  desc:     ["description","merchant","payee","name","original description","original statement","details"],
  amount:   ["amount","transaction amount","value"],
  outflow:  ["outflow","debit","withdrawal","money out","spent"],
  inflow:   ["inflow","credit","deposit","money in","received"],
  category: ["category group/category","category","parent category","budget category"],
  account:  ["account name","account","bank account"],
  type:     ["transaction type","type"]
};
function normHdr(row){ return row.map(x => String(x||"").trim().toLowerCase().replace(/\s+/g," ")); }
function detectSource(hdr){
  const h = normHdr(hdr), has = n => h.indexOf(n) >= 0;
  if(has("outflow") && has("inflow")) return "YNAB";
  if(has("original description") && has("transaction type")) return "Mint";
  if(has("original statement") || (has("merchant") && has("category") && has("account"))) return "Monarch";
  if(has("parent category")) return "Copilot";
  if(has("category") || has("payee")) return "another budgeting app";
  return null;
}
function mapHeaders(hdr){
  const h = normHdr(hdr), map = {}, claimed = {};
  const keys = Object.keys(H_ALIASES);
  // exact matches win, so "account name" cannot be stolen by the "name" alias
  keys.forEach(k => H_ALIASES[k].some(a => {
    const i = h.indexOf(a);
    if(i >= 0 && !claimed[i]){ map[k] = i; claimed[i] = 1; return true; }
    return false;
  }));
  keys.forEach(k => { if(map[k] == null) H_ALIASES[k].some(a => {
    const i = h.findIndex((c, j) => !claimed[j] && c.indexOf(a) >= 0);
    if(i >= 0){ map[k] = i; claimed[i] = 1; return true; }
    return false;
  }); });
  return map;
}
/* "Everyday Expenses: Groceries" and "Food/Groceries" both mean Groceries here. */
function cleanCatName(raw){
  let v = String(raw||"").trim();
  const i = Math.max(v.lastIndexOf(":"), v.lastIndexOf("/"));
  if(i >= 0 && i < v.length - 1) v = v.slice(i + 1).trim();
  return v.slice(0, 40);
}
/* Nothing is created while previewing — these run only on confirm. */
function ensureCat(rawName, incomeHint){
  const name = cleanCatName(rawName);
  if(!name) return null;
  const found = catByName(name);
  if(found) return found.id;
  const c = {id:uid(), name, key:name, group: incomeHint ? "Income" : "Everyday",
             kind: incomeHint ? "income" : "flex", budget:0};
  S.cats.push(c);
  return c.id;
}
function ensureAcct(rawName){
  const name = String(rawName||"").trim().slice(0,40);
  if(!name) return null;
  const found = S.accounts.find(a => a.name.toLowerCase() === name.toLowerCase());
  if(found) return found.id;
  const a = {id:uid(), name, kind:"Checking", balance:0};
  S.accounts.push(a);
  return a.id;
}
/* A budget/envelope export: category name plus a monthly amount. */
function parseBudgetImport(text){
  const rows = splitRows(text);
  if(!rows.length) return null;
  const width = Math.max.apply(null, rows.map(r => r.length));
  if(width < 2) return null;
  const hasHeader = rows.length > 1 && rows[0].every(c => asNum(c) === null);
  const hdr = hasHeader ? normHdr(rows[0]) : null;
  const body = hasHeader ? rows.slice(1) : rows;
  if(!body.length) return null;

  let nameCol = 0, amtCol = -1;
  if(hdr){
    const ci = hdr.findIndex(c => /categor|envelope|group|name/.test(c));
    if(ci >= 0) nameCol = ci;
    const bi = hdr.findIndex(c => /budget|planned|assigned|amount|monthly/.test(c));
    if(bi >= 0 && bi !== nameCol) amtCol = bi;
  }
  if(amtCol < 0) for(let i = width - 1; i >= 0; i--){
    if(i !== nameCol && body.some(r => asNum(r[i]) !== null)){ amtCol = i; break; }
  }
  if(amtCol < 0) return null;

  const out = [], seen = {};
  body.forEach(r => {
    const name = cleanCatName(r[nameCol]);
    const amt = asNum(r[amtCol]);
    if(!name || amt === null) return;
    const k = name.toLowerCase();
    const rec = {name, amount: round2(Math.abs(amt)), existing: !!catByName(name)};
    // a file with one row per month lands the most recent month last, so last wins
    if(seen[k] !== undefined) out[seen[k]] = rec;
    else { seen[k] = out.length; out.push(rec); }
  });
  return out.length ? out : null;
}

function parseImport(text, signMode){
  const rows = splitRows(text);
  if(rows.length < 1) return null;
  const width = Math.max.apply(null, rows.map(r => r.length));
  if(width < 2) return null;
  // drop a header row: one where no cell parses as a date
  const hasHeader = rows.length > 1 && !rows[0].some(asDate);
  let body = hasHeader ? rows.slice(1) : rows;
  if(!body.length) return null;

  // Header path: another app's export, where the category and account are already
  // chosen and worth keeping. Names are resolved on confirm, not here, so a preview
  // never creates anything.
  const map = hasHeader ? mapHeaders(rows[0]) : {};
  const hasAmt = map.amount != null || map.outflow != null || map.inflow != null;
  if(hasHeader && map.date != null && hasAmt){
    const amtCol = map.amount, signed = amtCol != null
      && body.some(r => (asNum(r[amtCol]) || 0) < 0);
    const out = [];
    body.forEach(r => {
      let amount;
      if(map.outflow != null || map.inflow != null){
        const o = map.outflow != null ? (asNum(r[map.outflow]) || 0) : 0;
        const i = map.inflow  != null ? (asNum(r[map.inflow])  || 0) : 0;
        if(!o && !i) return;
        amount = round2(Math.abs(i) - Math.abs(o));
      }else{
        const n = asNum(r[amtCol]);
        if(n === null) return;
        const ty = map.type != null ? String(r[map.type] || "").toLowerCase() : "";
        if(/debit|withdraw|purchase|expense/.test(ty))     amount = -Math.abs(n);
        else if(/credit|deposit|income|refund/.test(ty))   amount =  Math.abs(n);
        else if(signMode === "spend")                      amount = -Math.abs(n);
        else if(signMode === "signed")                     amount = n;
        else                                               amount = signed ? n : -Math.abs(n);
      }
      const date = asDate(r[map.date]) || isoOf(today());
      const merchant = String((map.desc != null && r[map.desc]) || "Imported").trim().slice(0,60) || "Imported";
      let catRaw = map.category != null ? cleanCatName(r[map.category]) : "";
      // YNAB parks income in a placeholder that is not a real category
      if(/^(ready to assign|to be budgeted|inflow|uncategorized|uncategorised)$/i.test(catRaw)) catRaw = "";
      const acctRaw = map.account != null ? String(r[map.account] || "").trim().slice(0,40) : "";
      const known = catRaw ? catByName(catRaw) : null;
      const knownAcct = acctRaw
        ? S.accounts.find(a => a.name.toLowerCase() === acctRaw.toLowerCase()) : null;
      out.push({
        id:uid(), date, merchant, amount:round2(amount),
        cat: known ? known.id : (catRaw ? null : guessCat(merchant, amount > 0)),
        catName: known ? null : (catRaw || null),
        acct: knownAcct ? knownAcct.id : null,
        acctName: knownAcct ? null : (acctRaw || null)
      });
    });
    if(!out.length) return null;
    const uniq = a => Array.from(new Set(a.filter(Boolean)));
    out.meta = {
      source: detectSource(rows[0]),
      newCats:  uniq(out.map(t => t.catName)),
      newAccts: uniq(out.map(t => t.acctName)),
      withCategory: out.filter(t => t.cat || t.catName).length
    };
    return out;
  }

  const score = { date:new Array(width).fill(0), num:new Array(width).fill(0), text:new Array(width).fill(0) };
  body.slice(0,40).forEach(r => {
    for(let i=0;i<width;i++){
      const v = r[i] || "";
      if(asDate(v)) score.date[i]++;
      else if(asNum(v) !== null) score.num[i]++;
      else if(v.length > 2) score.text[i] += Math.min(v.length, 30);
    }
  });
  const best = arr => arr.indexOf(Math.max.apply(null, arr));
  const dCol = score.date.some(v=>v>0) ? best(score.date) : -1;
  const tCol = best(score.text);
  let nCol = -1, bestScore = -1;
  for(let i=0;i<width;i++){
    if(i === dCol) continue;
    const vals = body.map(r => asNum(r[i])).filter(v => v !== null);
    if(!vals.length) continue;
    const nonInt = vals.filter(v => Math.abs(v % 1) > 0).length;
    const sc = score.num[i] + nonInt * 2 + (vals.some(v => v < 0) ? 8 : 0);
    if(sc > bestScore){ bestScore = sc; nCol = i; }
  }
  if(nCol < 0) return null;

  const anyNegative = body.some(r => (asNum(r[nCol]) || 0) < 0);
  const out = [];
  body.forEach(r => {
    const n = asNum(r[nCol]); if(n === null) return;
    const date = (dCol >= 0 && asDate(r[dCol])) || isoOf(today());
    const merchant = (r[tCol] || r.find(c => c && !asNum(c) && !asDate(c)) || "Imported").slice(0,60);
    let amount;
    if(signMode === "spend")      amount = -Math.abs(n);
    else if(signMode === "signed") amount = n;
    else                           amount = anyNegative ? n : -Math.abs(n);
    const cat = guessCat(merchant, amount > 0);
    out.push({id:uid(), date, merchant, amount:round2(amount), cat, acct:(S.accounts[0]||{}).id});
  });
  return out.length ? out : null;
}

/* ═══════════════════ chart helpers ═══════════════════ */
const f1 = n => Math.round(n*10)/10;
function niceTop(max){
  if(!(max > 0)) return 100;
  const step = Math.pow(10, Math.floor(Math.log10(max))) / 2;
  return Math.ceil(max / step) * step;
}
function axisMoney(v, top){
  const a = Math.abs(v), sign = v < 0 ? "−$" : "$";
  return top >= 1000 ? sign + (Math.round(a/100)/10) + "k" : sign + Math.round(a);
}
// bars are rounded at the data end and square on the baseline
function barUp(x, y, w, h, r){
  if(h <= 0) return "";
  r = Math.min(r, w/2, h);
  return "M"+f1(x)+","+f1(y+h)+"V"+f1(y+r)+"Q"+f1(x)+","+f1(y)+" "+f1(x+r)+","+f1(y)
    +"H"+f1(x+w-r)+"Q"+f1(x+w)+","+f1(y)+" "+f1(x+w)+","+f1(y+r)+"V"+f1(y+h)+"Z";
}
function barDown(x, y0, w, h, r){
  if(h <= 0) return "";
  r = Math.min(r, w/2, h);
  const yb = y0 + h;
  return "M"+f1(x)+","+f1(y0)+"V"+f1(yb-r)+"Q"+f1(x)+","+f1(yb)+" "+f1(x+r)+","+f1(yb)
    +"H"+f1(x+w-r)+"Q"+f1(x+w)+","+f1(yb)+" "+f1(x+w)+","+f1(yb-r)+"V"+f1(y0)+"Z";
}
function tipRow(color, label, value){
  return '<div class="r"><span>'+(color ? '<i style="background:'+color+'"></i>' : "")+esc(label)+'</span><span>'+value+'</span></div>';
}
function chartBox(id, svg){ return '<div class="chartbox" data-tip="'+id+'">'+svg+'<div class="tip"></div></div>'; }
const AXIS_TXT = 'font-size="10.5" font-family="IBM Plex Mono, monospace" fill="var(--muted)"';
function hGrid(y, L, W, R, label){
  return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+f1(y)+'" y2="'+f1(y)+'" stroke="var(--grid)" stroke-width="1"/>'
    + (label != null ? '<text x="'+(L-8)+'" y="'+f1(y+4)+'" text-anchor="end" '+AXIS_TXT+'>'+label+'</text>' : "");
}
function wireCharts(){
  document.querySelectorAll(".chartbox[data-tip]").forEach(box => {
    const fn = TIPS[box.dataset.tip]; if(!fn) return;
    const tip = box.querySelector(".tip"), xh = box.querySelector(".xh");
    const hide = () => { tip.classList.remove("on"); if(xh) xh.style.opacity = 0; };
    box.addEventListener("pointermove", e => {
      const r = e.target.closest ? e.target.closest(".hv") : null;
      if(!r){ hide(); return; }
      tip.innerHTML = fn(+r.dataset.i);
      if(xh && r.dataset.x){ xh.setAttribute("x1", r.dataset.x); xh.setAttribute("x2", r.dataset.x); xh.style.opacity = .55; }
      const b = box.getBoundingClientRect();
      tip.classList.add("on");
      let left = e.clientX - b.left + 14;
      if(left + tip.offsetWidth > b.width) left = e.clientX - b.left - tip.offsetWidth - 14;
      tip.style.left = clamp(left, 0, Math.max(0, b.width - tip.offsetWidth)) + "px";
      tip.style.top  = clamp(e.clientY - b.top - tip.offsetHeight - 10, -10, b.height) + "px";
    });
    box.addEventListener("pointerleave", hide);
  });
}

/* ═══════════════════ report data ═══════════════════ */
function monthFlow(ym){
  const t = txnsIn(ym);
  const income = t.reduce((a,x)=> a + (isIncome(x) ? x.amount : 0), 0);
  const spend  = t.reduce((a,x)=> a + (isIncome(x) ? 0 : -x.amount), 0);
  return {ym, label:SHORT[parseYM(ym)[1]], income, spend, net: income - spend};
}
function flowData(n){
  const out = [];
  for(let i=n-1;i>=0;i--) out.push(monthFlow(shiftYM(UI.month,-i)));
  return out;
}
function cumSpend(ym){
  const arr = new Array(daysIn(ym)).fill(0);
  txnsIn(ym).forEach(t => { if(!isIncome(t)) arr[parseInt(t.date.slice(8,10),10)-1] += -t.amount; });
  let c = 0;
  return arr.map(v => (c += v));
}
const netWorthNow = () => S.accounts.reduce((a,x)=>a+x.balance,0);
// balances are entered as of today, so earlier months are rebuilt by
// taking each later month's net cash flow back out
function netWorthSeries(n){
  const nowYM = ymOf(today()), end = UI.month < nowYM ? UI.month : nowYM, net = netWorthNow();
  const out = [];
  for(let i=n-1;i>=0;i--){
    const ym = shiftYM(end,-i);
    let after = 0, k = ym;
    while(k < nowYM){ k = shiftYM(k,1); after += monthFlow(k).net; }
    out.push({ym, label:SHORT[parseYM(ym)[1]], v: net - after});
  }
  return out;
}
function sumByCat(months, pickIncome){
  const m = {};
  months.forEach(ym => txnsIn(ym).forEach(t => {
    if(isIncome(t) !== pickIncome) return;
    m[t.cat] = (m[t.cat]||0) + (pickIncome ? t.amount : -t.amount);
  }));
  return m;
}
function median(arr){
  const a = arr.slice().sort((x,y)=>x-y), h = Math.floor(a.length/2);
  return a.length % 2 ? a[h] : (a[h-1] + a[h]) / 2;
}
function monthsBetween(a, b){
  const [ya,ma] = parseYM(a), [yb,mb] = parseYM(b);
  return (yb-ya)*12 + (mb-ma);
}

/* recurring: match a bill to a transaction with the same merchant name that month */
function billStates(ym){
  const now = today(), cur = ymOf(now) === ym, future = ym > ymOf(now);
  const tx = txnsIn(ym).filter(t => !isIncome(t));
  return S.bills.map(b => {
    const paid = tx.find(t => t.merchant.toLowerCase() === b.name.toLowerCase()) || null;
    const day = Math.min(b.day, daysIn(ym));
    const days = cur ? day - now.getDate() : (future ? 99 : -99);
    const state = paid ? "paid"
      : cur ? (days < 0 ? "late" : days <= 5 ? "soon" : "upcoming")
      : future ? "upcoming" : "missed";
    return {b, day, paid, days, state};
  }).sort((a,z)=> a.day - z.day);
}
function stateLabel(x){
  if(x.state === "paid") return "Paid " + shortDate(x.paid.date);
  if(x.state === "late") return Math.abs(x.days) + " day" + (Math.abs(x.days)===1?"":"s") + " late";
  if(x.state === "missed") return "Not paid";
  if(x.days === 0) return "Due today";
  if(x.days === 1) return "Due tomorrow";
  if(x.days !== 99) return "Due in " + x.days + " days";
  return "Upcoming";
}
const STATE_PILL = {paid:"good", soon:"warn", late:"bad", missed:"bad", upcoming:"info"};
let SUGGESTED = [];
// merchants charged in 3 of the last 4 full months at a steady amount
function suggestRecurring(){
  const cur = ymOf(today()), months = [1,2,3,4].map(i => shiftYM(cur,-i));
  const known = {}; S.bills.forEach(b => known[b.name.toLowerCase()] = 1);
  const map = {};
  S.txns.forEach(t => {
    const ym = monthOf(t.date);
    if(months.indexOf(ym) < 0 || isIncome(t) || isXfer(t)) return;
    const k = t.merchant.trim().toLowerCase();
    if(known[k]) return;
    const m = map[k] || (map[k] = {name:t.merchant, hits:{}, amts:[], days:[], cat:t.cat});
    m.hits[ym] = 1; m.amts.push(-t.amount); m.days.push(parseInt(t.date.slice(8,10),10));
  });
  return Object.keys(map).map(k => map[k]).filter(m => {
    const n = Object.keys(m.hits).length;
    return n >= 3 && m.amts.length <= n + 1 && Math.min.apply(null,m.amts) > 0
      && Math.max.apply(null,m.amts) <= Math.min.apply(null,m.amts) * 1.2;
  }).map(m => ({name:m.name, amount:round2(median(m.amts)), day:Math.round(median(m.days)), cat:m.cat, n:Object.keys(m.hits).length}))
    .sort((a,b)=> b.amount - a.amount).slice(0,6);
}

/* goals */
function goalInfo(g){
  const cur = ymOf(today()), left = Math.max(0, g.target - g.saved);
  const monthsLeft = g.by ? monthsBetween(cur, g.by) : null;
  const need = left <= 0 ? 0 : (monthsLeft && monthsLeft > 0 ? left / monthsLeft : left);
  const eta = left <= 0 ? cur : (g.monthly > 0 ? shiftYM(cur, Math.ceil(left / g.monthly)) : null);
  let state, label;
  if(left <= 0){ state = "good"; label = "Goal reached"; }
  else if(monthsLeft !== null && monthsLeft <= 0){ state = "bad"; label = "Target date has passed"; }
  else if(!g.monthly){ state = "warn"; label = "Set a monthly amount"; }
  else if(g.by && eta > g.by){ state = "warn"; label = "Needs " + usd(Math.ceil(need)) + "/mo to finish on time"; }
  else { state = "good"; label = "On track"; }
  return {left, monthsLeft, need, eta, state, label, pct: g.target > 0 ? clamp(g.saved / g.target, 0, 1) : 0};
}
function parseYMInput(v){
  const s = String(v||"").trim();
  let m = s.match(/^(\d{4})-(\d{1,2})/);
  if(m) return m[1] + "-" + pad(clamp(+m[2],1,12));
  m = s.match(/^(\d{1,2})\/(\d{2,4})$/);
  if(m){ const y = m[2].length === 2 ? 2000 + +m[2] : +m[2]; return y + "-" + pad(clamp(+m[1],1,12)); }
  return null;
}

/* ═══════════════════ charts ═══════════════════ */
function nwChart(series){
  const W = 520, H = 150, L = 8, R = 10, T = 12, B = 24, iw = W-L-R, ih = H-T-B;
  const vals = series.map(d => d.v);
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const padV = Math.max(50, (hi - lo) * .18); lo -= padV; hi += padV;
  const n = series.length, step = n > 1 ? iw/(n-1) : iw;
  const x = i => L + (n > 1 ? i*step : iw/2), y = v => T + ih - (v-lo)/(hi-lo)*ih;
  const line = "M" + series.map((d,i)=> f1(x(i))+","+f1(y(d.v))).join("L");
  const area = line + "L"+f1(x(n-1))+","+(T+ih)+"L"+f1(x(0))+","+(T+ih)+"Z";
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Estimated net worth, last '+n+' months">'
    + hGrid(T, L, W, R) + hGrid(T+ih/2, L, W, R) + hGrid(T+ih, L, W, R)
    + '<path d="'+area+'" fill="var(--s1)" fill-opacity=".12"/>'
    + '<path d="'+line+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(T+ih)+'"/>'
    + '<circle cx="'+f1(x(n-1))+'" cy="'+f1(y(vals[n-1]))+'" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>'
    + '<text x="'+f1(x(0))+'" y="'+(H-6)+'" '+AXIS_TXT+'>'+esc(ymLabel(series[0].ym).replace(/(\w{3})\w* /,"$1 "))+'</text>'
    + '<text x="'+f1(x(n-1))+'" y="'+(H-6)+'" text-anchor="end" '+AXIS_TXT+'>'+esc(ymLabel(series[n-1].ym).replace(/(\w{3})\w* /,"$1 "))+'</text>';
  series.forEach((d,i) => {
    svg += '<rect class="hv" data-i="'+i+'" data-x="'+f1(x(i))+'" x="'+f1(x(i)-step/2)+'" y="0" width="'+f1(step)+'" height="'+H+'" fill="transparent"/>';
  });
  TIPS.nw = i => '<b>'+esc(ymLabel(series[i].ym))+'</b>' + tipRow("var(--s1)", "Net worth", usd(series[i].v))
    + (i > 0 ? tipRow(null, "Change", (series[i].v - series[i-1].v >= 0 ? "+" : "") + usd(series[i].v - series[i-1].v)) : "");
  return chartBox("nw", svg + '</svg>');
}

function spendChart(ym){
  const s = summary(ym), a = cumSpend(ym), pym = shiftYM(ym,-1), b = cumSpend(pym);
  const upto = s.cur ? s.dayNow : (ym > ymOf(today()) ? 0 : a.length);
  const cur = a.slice(0, upto), n = Math.max(a.length, b.length);
  const W = 520, H = 196, L = 48, R = 10, T = 12, B = 26, iw = W-L-R, ih = H-T-B;
  const top = niceTop(Math.max(cur.length ? cur[cur.length-1] : 0, b[b.length-1] || 0));
  const x = i => L + i/(n-1)*iw, y = v => T + ih - v/top*ih, step = iw/(n-1);
  const path = arr => arr.length ? "M" + arr.map((v,i)=> f1(x(i))+","+f1(y(v))).join("L") : "";
  const m = parseYM(ym)[1], pm = parseYM(pym)[1];
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Spending so far this month compared with last month">'
    + hGrid(y(0), L, W, R, "$0") + hGrid(y(top/2), L, W, R, axisMoney(top/2, top)) + hGrid(y(top), L, W, R, axisMoney(top, top))
    + '<path d="'+path(b)+'" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" stroke-linejoin="round"/>';
  if(cur.length){
    const line = path(cur);
    svg += '<path d="'+line+'L'+f1(x(cur.length-1))+','+f1(y(0))+'L'+f1(x(0))+','+f1(y(0))+'Z" fill="var(--s1)" fill-opacity=".12"/>'
      + '<path d="'+line+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
      + '<circle cx="'+f1(x(cur.length-1))+'" cy="'+f1(y(cur[cur.length-1]))+'" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>';
  }
  svg += '<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(T+ih)+'"/>';
  [1, 8, 15, 22, n].forEach((d,k) => {
    svg += '<text x="'+f1(x(d-1))+'" y="'+(H-7)+'" text-anchor="'+(k===0?"start":k===4?"end":"middle")+'" '+AXIS_TXT+'>'
      + (k===0 ? SHORT[m]+" " : "") + d + '</text>';
  });
  for(let i=0;i<n;i++){
    svg += '<rect class="hv" data-i="'+i+'" data-x="'+f1(x(i))+'" x="'+f1(x(i)-step/2)+'" y="0" width="'+f1(step)+'" height="'+H+'" fill="transparent"/>';
  }
  TIPS.spend = i => '<b>Day '+(i+1)+'</b>'
    + (i < cur.length ? tipRow("var(--s1)", MONTHS[m], usd(cur[i])) : "")
    + (i < b.length ? tipRow("var(--muted)", MONTHS[pm], usd(b[i])) : "");
  return chartBox("spend", svg + '</svg>');
}

function flowChart(data, id){
  const W = 680, H = 236, L = 54, R = 8, T = 14, B = 34, iw = W-L-R, ih = H-T-B;
  const top = niceTop(Math.max.apply(null, data.map(d => Math.max(d.income, d.spend))));
  const y = v => T + ih - (v/top)*ih;
  const gw = iw/data.length, bw = Math.max(5, Math.min(26, gw/2 - 5));
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Money in and money out by month">'
    + hGrid(y(top), L, W, R, axisMoney(top, top)) + hGrid(y(top/2), L, W, R, axisMoney(top/2, top))
    + hGrid(y(0), L, W, R, "$0");
  data.forEach((d,i) => {
    const cx = L + gw*i + gw/2;
    const hIn = Math.max(0, ih - (y(Math.max(0,d.income)) - T)), hOut = Math.max(0, ih - (y(Math.max(0,d.spend)) - T));
    svg += '<path d="'+barUp(cx - bw - 1, T+ih-hIn, bw, hIn, 4)+'" fill="var(--s2)"/>'
      + '<path d="'+barUp(cx + 1, T+ih-hOut, bw, hOut, 4)+'" fill="var(--s1)"/>'
      + '<text x="'+f1(cx)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">'+d.label+'</text>'
      + '<rect class="hv" data-i="'+i+'" x="'+f1(L+gw*i)+'" y="0" width="'+f1(gw)+'" height="'+H+'" fill="transparent"/>';
  });
  TIPS[id] = i => { const d = data[i]; return '<b>'+esc(ymLabel(d.ym))+'</b>'
    + tipRow("var(--s2)", "In", usd(d.income)) + tipRow("var(--s1)", "Out", usd(d.spend))
    + tipRow(null, d.net >= 0 ? "Saved" : "Overspent", usd(Math.abs(d.net))); };
  return chartBox(id, svg + '</svg>');
}

function netBars(data){
  const W = 520, H = 140, L = 46, R = 8, T = 10, B = 24, iw = W-L-R, ih = H-T-B;
  const top = niceTop(Math.max(100, Math.max.apply(null, data.map(d => Math.abs(d.net)))));
  const hasNeg = data.some(d => d.net < 0), lo = hasNeg ? -top : 0;
  const y = v => T + (top - v)/(top - lo)*ih, gw = iw/data.length, bw = Math.min(30, gw*.5);
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Money kept each month">'
    + hGrid(y(top), L, W, R, axisMoney(top, top)) + (hasNeg ? hGrid(y(lo), L, W, R, axisMoney(lo, top)) : "");
  data.forEach((d,i) => {
    const x = L + gw*i + (gw-bw)/2, cx = L + gw*i + gw/2;
    svg += d.net >= 0
      ? '<path d="'+barUp(x, y(d.net), bw, y(0)-y(d.net), 4)+'" fill="var(--s1)"/>'
      : '<path d="'+barDown(x, y(0), bw, y(d.net)-y(0), 4)+'" fill="var(--s2)"/>';
    svg += '<text x="'+f1(cx)+'" y="'+(H-6)+'" text-anchor="middle" '+AXIS_TXT+'>'+d.label+'</text>'
      + '<rect class="hv" data-i="'+i+'" x="'+f1(L+gw*i)+'" y="0" width="'+f1(gw)+'" height="'+H+'" fill="transparent"/>';
  });
  svg += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+f1(y(0))+'" y2="'+f1(y(0))+'" stroke="var(--line-strong)" stroke-width="1"/>'
    + '<text x="'+(L-8)+'" y="'+f1(y(0)+4)+'" text-anchor="end" '+AXIS_TXT+'>$0</text>';
  TIPS.net = i => { const d = data[i]; return '<b>'+esc(ymLabel(d.ym))+'</b>'
    + tipRow(d.net >= 0 ? "var(--s1)" : "var(--s2)", d.net >= 0 ? "Kept" : "Overspent", usd(Math.abs(d.net)))
    + tipRow(null, "In", usd(d.income)) + tipRow(null, "Out", usd(d.spend)); };
  return chartBox("net", svg + '</svg>');
}

function catBars(rows, color, total){

      + '<div class="n">'+esc(r.name)+'</div>'
      + '<div class="t"><div class="f" style="width:'+Math.max(1.5,(r.v/max)*100).toFixed(1)+'%;background:'+color+'"></div></div>'
      + '<div class="v">'+usd(r.v)+'</div></div>';

function legend(items){

/* ═══════════════════ donut + cash flow Sankey ═══════════════════ */
const CAT_COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];

// top five categories get their own colour (fixed order); the rest fold into "Everything else"
function donutRows(spent){
  const rows = S.cats.filter(isSpendCat).map(c => ({name:c.name, v:spent[c.id] || 0})).filter(r => r.v > 0).sort((a,b) => b.v - a.v);
  if(rows.length <= 6) return rows.map((r,i) => Object.assign(r, {color:CAT_COLORS[i]}));
  const top = rows.slice(0,5).map((r,i) => Object.assign(r, {color:CAT_COLORS[i]}));
  const rest = rows.slice(5);
  top.push({name:"Everything else", v:rest.reduce((a,r) => a + r.v, 0), color:"var(--c-other)", n:rest.length});
  return top;
}
function arcPath(cx, cy, r0, r1, a0, a1){
  const p = (r, a) => f1(cx + r * Math.sin(a)) + "," + f1(cy - r * Math.cos(a));
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return "M" + p(r1, a0) + "A" + r1 + "," + r1 + " 0 " + large + " 1 " + p(r1, a1)
    + "L" + p(r0, a1) + "A" + r0 + "," + r0 + " 0 " + large + " 0 " + p(r0, a0) + "Z";
}
function donutChart(rows, id, centerLabel){
  const total = rows.reduce((a,r) => a + r.v, 0);
  if(!total) return '<div class="empty">No spending logged for this month yet.</div>';
  const S2 = 220, cx = 110, cy = 110, r1 = 100, r0 = 66;
  let a = 0, paths = "";
  rows.forEach((r,i) => {
    let span = r.v / total * Math.PI * 2;
    if(span >= Math.PI * 2 - 1e-6) span = Math.PI * 2 - 1e-4;            // a full ring still needs two points
    paths += '<path class="hv slice" data-i="'+i+'" d="'+arcPath(cx, cy, r0, r1, a, a + span)+'" stroke="var(--surface)" stroke-width="2" style="fill:'+r.color+';cursor:pointer"/>';
    a += span;
  });
  TIPS[id] = i => { const r = rows[i]; return '<b>'+esc(r.name)+'</b>'
    + tipRow(r.color, "Spent", usd(r.v, true)) + tipRow(null, "Share", Math.round(r.v / total * 100) + "%")
    + (r.n ? tipRow(null, "Categories", String(r.n)) : ""); };
  return '<div class="donut">'
    + '<div class="chartbox" data-tip="'+id+'" style="width:min(100%,220px);flex:none">'
      + '<svg viewBox="0 0 '+S2+' '+S2+'" role="img" aria-label="Spending by category">' + paths
      + '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="24" fill="var(--ink)">'+esc(usd(total))+'</text>'
      + '<text x="'+cx+'" y="'+(cy+18)+'" text-anchor="middle" '+AXIS_TXT+'>'+esc(centerLabel || "spent")+'</text>'
      + '</svg><div class="tip"></div></div>'
    + '<ul class="dlegend">' + rows.map(r => '<li><i style="background:'+r.color+'"></i><span class="n">'+esc(r.name)+'</span>'
        + '<span class="v">'+usd(r.v)+'</span><span class="p">'+Math.round(r.v / total * 100)+'%</span></li>').join("") + '</ul>'
  + '</div>';
}

// income on the left, where it went on the right; ribbons split each source in proportion
function sankeyChart(months, id){
  const got = sumByCat(months, true), spent = sumByCat(months, false);
  const left = S.cats.filter(c => c.kind === "income").map(c => ({name:c.name, v:got[c.id] || 0})).filter(r => r.v > 0);
  const groups = GROUP_ORDER.filter(g => g !== "Income" && g !== "Transfers").map(g => ({
    name:g, v:S.cats.filter(c => c.group === g && isSpendCat(c)).reduce((a,c) => a + (spent[c.id] || 0), 0)
  })).filter(r => r.v > 0);
  const inc = left.reduce((a,r) => a + r.v, 0), out = groups.reduce((a,r) => a + r.v, 0);
  if(!inc && !out) return '<div class="empty">Log income and spending to see where your money goes.</div>';
  if(out > inc) left.push({name:"From savings", v:out - inc, muted:true});
  const right = groups.map((r,i) => Object.assign(r, {color:CAT_COLORS[i % CAT_COLORS.length]}));
  if(inc > out) right.push({name:"Kept", v:inc - out, color:"var(--good)", kept:true});
  left.forEach(r => r.color = r.muted ? "var(--c-other)" : "var(--s2)");

  const T = Math.max(inc, out), W = 680, H = 300, gap = 12, nodeW = 12, xL = 150, xR = W - 170;
  const k = Math.min((H - gap * Math.max(0, left.length - 1)) / T, (H - gap * Math.max(0, right.length - 1)) / T);
  const stack = (nodes) => { let y = 0; nodes.forEach(n => { n.h = Math.max(1.5, n.v * k); n.y = y; n.off = 0; y += n.h + gap; });
    const used = y - gap, shift = (H - used) / 2; nodes.forEach(n => n.y += shift); };
  stack(left); stack(right);

  let ribbons = "", flows = [], labels = "", nodes = "";
  left.forEach(L => right.forEach(R => {
    const v = L.v * (R.v / T), h = v * k;
    if(h < .3) return;
    const y0 = L.y + L.off, y1 = R.y + R.off, x0 = xL + nodeW, x1 = xR, mx = (x0 + x1) / 2;
    L.off += h; R.off += h;
    flows.push({from:L.name, to:R.name, v});
    ribbons += '<path class="hv" data-i="'+(flows.length-1)+'" d="M'+x0+','+f1(y0)+'C'+mx+','+f1(y0)+' '+mx+','+f1(y1)+' '+x1+','+f1(y1)
      + 'V'+f1(y1+h)+'C'+mx+','+f1(y1+h)+' '+mx+','+f1(y0+h)+' '+x0+','+f1(y0+h)+'Z" style="fill:'+R.color+';fill-opacity:.28;cursor:pointer"/>';
  }));
  const label = (x, n, anchor) => '<text x="'+x+'" y="'+f1(n.y + n.h/2 - 2)+'" text-anchor="'+anchor+'" font-size="12.5" font-weight="600" fill="var(--ink)" font-family="Public Sans, sans-serif">'+esc(n.name)+'</text>'
    + '<text x="'+x+'" y="'+f1(n.y + n.h/2 + 13)+'" text-anchor="'+anchor+'" '+AXIS_TXT+'>'+esc(usd(n.v))+' · '+Math.round(n.v / T * 100)+'%</text>';
  left.forEach(n => { nodes += '<rect x="'+xL+'" y="'+f1(n.y)+'" width="'+nodeW+'" height="'+f1(n.h)+'" rx="3" fill="'+n.color+'"/>'; labels += label(xL - 10, n, "end"); });
  right.forEach(n => { nodes += '<rect x="'+xR+'" y="'+f1(n.y)+'" width="'+nodeW+'" height="'+f1(n.h)+'" rx="3" fill="'+n.color+'"/>'; labels += label(xR + nodeW + 10, n, "start"); });
  TIPS[id] = i => { const f = flows[i]; return '<b>'+esc(f.from)+' → '+esc(f.to)+'</b>' + tipRow(null, "Amount", usd(f.v, true)); };
  return '<div class="scroll-x"><div class="chartbox" data-tip="'+id+'" style="min-width:560px">'
    + '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Where your income went">' + ribbons + nodes + labels + '</svg>'
    + '<div class="tip"></div></div></div>';
}

  const period = n === 1 ? ymLabel(UI.month) : SHORT[parseYM(months[0])[1]] + " " + months[0].slice(0,4) + " – " + SHORT[parseYM(UI.month)[1]] + " " + UI.month.slice(0,4);

  const spent = sumByCat(months, false), got = sumByCat(months, true);
  const incRows = S.cats.filter(c => c.kind === "income").map(c => ({name:c.name, v:got[c.id]||0})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);

  return '<div class="wrap"><div class="view">'

      + '<div class="sec-head"><h2>Cash flow · '+esc(period)+'</h2><div class="tools"><div class="seg" role="group" aria-label="Report period">'+seg+'</div></div></div>'
      + '<div class="tiles">'
        + '<div class="tile"><span class="eyebrow">Income</span><span class="v">'+usd(inc)+'</span><span class="s">'+(n>1?usd(inc/active)+' a month on average':'money in this month')+'</span></div>'
        + '<div class="tile"><span class="eyebrow">Expenses</span><span class="v">'+usd(out)+'</span><span class="s">'+(n>1?usd(out/active)+' a month on average':'money out this month')+'</span></div>'
        + '<div class="tile"><span class="eyebrow">Net savings</span><span class="v" style="color:'+(net>=0?"var(--good)":"var(--bad)")+'">'+usd(net)+'</span><span class="s">'+(net>=0?"kept after spending":"more out than in")+'</span></div>'
        + '<div class="tile"><span class="eyebrow">Savings rate</span><span class="v">'+rate+'%</span><span class="s">of income kept</span></div>'
      + '</div>'
    + '</section>'
    + '<section class="card"><div class="card-h"><h2>Where your money went</h2><span class="note" style="margin-left:8px">'+esc(period)+'</span></div>'
      + sankeyChart(months, "sankey")

    + '</section>'
    + '<section class="card"><div class="card-h"><h2>Spending by category</h2><span class="note" style="margin-left:8px">'+esc(period)+'</span></div>'
      + donutChart(donutRows(spent), "donut-cf", n === 1 ? "spent" : "spent in " + n + " months")
    + '</section>'
    + (n > 1 ? '<section class="card">'
      + '<div class="card-h"><h2>In and out by month</h2><div style="margin-left:auto">'+legend([["var(--s2)","Money in"],["var(--s1)","Money out"]])+'</div></div>'
      + flowChart(data, "flow")
      + '<details class="tbl"><summary>Show these numbers as a table</summary><div class="scroll-x"><table><thead><tr><th>Month</th><th>In</th><th>Out</th><th>Kept</th><th>Rate</th></tr></thead><tbody>'
        + data.map(d => '<tr><td>'+esc(ymLabel(d.ym))+'</td><td>'+usd(d.income)+'</td><td>'+usd(d.spend)+'</td><td>'+usd(d.net)+'</td><td>'+(d.income>0?Math.round(d.net/d.income*100):0)+'%</td></tr>').join("")
